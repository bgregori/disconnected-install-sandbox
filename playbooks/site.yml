---
- name: Phase 1 — provision AWS infrastructure
  ansible.builtin.import_playbook: phase1_provision.yml

- name: refresh inventory after provisioning
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  tasks:
    - name: refresh dynamic inventory to discover new instances
      ansible.builtin.meta: refresh_inventory

    - name: wait for bastion ssh to become available
      ansible.builtin.wait_for:
        host: "{{ infra_ec2_bastion_eip }}"
        port: 22
        timeout: 300
        msg: >-
          Bastion {{ infra_ec2_bastion_eip }}:22 never answered. Check that
          admin_cidr is still your public IP, and that VPC Block Public Access is
          off: aws ec2 describe-vpc-block-public-access-options --region {{ aws_region }}
      when: infra_ec2_bastion_eip is defined

- name: Phase 2 — configure RHEL 9 services
  ansible.builtin.import_playbook: phase2_configure.yml
