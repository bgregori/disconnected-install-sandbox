---
- name: Phase 1 — provision AWS infrastructure for disconnected sandbox
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  pre_tasks:
    - name: validate required variables
      ansible.builtin.assert:
        that:
          - aws_region is defined and aws_region | length > 0
          - sandbox_domain is defined and sandbox_domain | length > 0
          - admin_cidr is defined and admin_cidr | length > 0
        fail_msg: >-
          Missing required variables. Run with:
          ansible-playbook playbooks/phase1_provision.yml
          -e aws_region=us-east-2
          -e sandbox_domain=example.com
          -e admin_cidr=$(curl -s ifconfig.me)/32

    # The aws_ec2 inventory plugin cannot see -e vars, so it reads AWS_REGION
    # (falling back to us-east-2). If the two disagree, Phase 1 builds in one
    # region, the inventory refresh looks in the other, and Phase 2 silently
    # matches no hosts.
    - name: validate inventory region matches aws_region
      ansible.builtin.assert:
        that:
          - phase1_inventory_region == aws_region
        fail_msg: >-
          aws_region is '{{ aws_region }}' but the dynamic inventory will search
          '{{ phase1_inventory_region }}' (from AWS_REGION, default us-east-2).
          Run: export AWS_REGION={{ aws_region }}
        quiet: true
      vars:
        phase1_inventory_region: "{{ lookup('env', 'AWS_REGION') | default('us-east-2', true) }}"

    - name: validate topology name
      ansible.builtin.assert:
        that:
          - ocp_topology in ocp_topology_presets
        fail_msg: >-
          Unknown ocp_topology '{{ ocp_topology }}'. Choose one of
          {{ ocp_topology_presets.keys() | list | join(', ') }}.
        quiet: true

    - name: validate cluster topology
      ansible.builtin.assert:
        that:
          - (ocp_master_count | int) in [1, 3, 5]
          - (ocp_master_count | int) == 1 or (ocp_worker_count | int) != 1
        fail_msg: >-
          Invalid node counts for topology '{{ ocp_topology }}': the control
          plane must have 1, 3, or 5 members (got {{ ocp_master_count }}) and a
          multi-node cluster needs either 0 or 2+ workers
          (got {{ ocp_worker_count }}).
        success_msg: >-
          Topology '{{ ocp_topology }}': {{ ocp_master_count }} master(s),
          {{ ocp_worker_count }} worker(s) on {{ ocp_node_ips | join(', ') }}

    - name: validate kvm data volume fits the topology
      ansible.builtin.assert:
        that:
          - (kvm_data_volume_size | int) >= ocp_topology_required_disk_gb | int
        fail_msg: >-
          kvm_data_volume_size is {{ kvm_data_volume_size }} GB but topology
          '{{ ocp_topology }}' needs at least
          {{ ocp_topology_required_disk_gb }} GB of VM disk images.
        success_msg: >-
          Data volume {{ kvm_data_volume_size }} GB covers
          {{ ocp_topology_required_disk_gb }} GB of VM disks
      vars:
        ocp_topology_required_disk_gb: >-
          {{ (ocp_nodes | map(attribute='disk_gb') | map('int') | sum)
             + (ocp_nodes | selectattr('storage_disk')
                | map(attribute='storage_disk_gb') | map('int') | sum) }}
      when: enable_kvm_host | bool

    - name: validate aws credentials are available
      amazon.aws.aws_caller_info:
        region: "{{ aws_region }}"
      register: aws_identity

    - name: display aws account info
      ansible.builtin.debug:
        msg: "Authenticated as {{ aws_identity.arn }} in region {{ aws_region }}"

    # Read-only: reports each region's Block Public Access mode, or 'unknown'
    # if it cannot be read (boto3 too old, region not opted in, no permission).
    # amazon.aws has no module for this, so call boto3 directly.
    - name: read vpc block public access mode
      ansible.builtin.command:
        argv: "{{ [ansible_playbook_python, '-c', bpa_script, aws_region]
                  + (bpa_check_regions | difference([aws_region])) }}"
      register: bpa_mode_result
      changed_when: false
      when: bpa_check | bool
      vars:
        bpa_script: |
          import json, sys, boto3
          modes = {}
          for region in sys.argv[1:]:
              try:
                  ec2 = boto3.client('ec2', region_name=region)
                  opts = ec2.describe_vpc_block_public_access_options()
                  modes[region] = opts['VpcBlockPublicAccessOptions']['InternetGatewayBlockMode']
              except Exception as exc:
                  modes[region] = 'unknown: ' + str(exc).splitlines()[0]
          print(json.dumps(modes))

    - name: warn when block public access could not be read
      ansible.builtin.debug:
        msg: >-
          Could not read VPC Block Public Access for {{ aws_region }}
          ({{ bpa_modes[aws_region] }}). Continuing; if site.yml later times out
          waiting for bastion SSH, check it with:
          aws ec2 describe-vpc-block-public-access-options --region {{ aws_region }}
      when:
        - bpa_check | bool
        - bpa_modes[aws_region] is match('unknown')
      vars:
        bpa_modes: "{{ bpa_mode_result.stdout | from_json }}"

    - name: validate block public access allows the bastion
      ansible.builtin.assert:
        that:
          - bpa_modes[aws_region] is not match('block-')
        fail_msg: >-
          VPC Block Public Access is '{{ bpa_modes[aws_region] }}' in
          {{ aws_region }} for account {{ aws_identity.account }}. AWS drops
          internet traffic to the bastion in this mode, so Phase 2 would time out
          waiting for SSH. This is an account setting, not a fault in this repo.
          Nothing has been created. Clear regions checked: {{ bpa_clear_regions }}.
          Re-run in one of them with export AWS_REGION=<region> and
          -e aws_region=<region>, or ask the account admin for a BPA exclusion
          and pass -e bpa_check=false.
        quiet: true
      when: bpa_check | bool
      vars:
        bpa_modes: "{{ bpa_mode_result.stdout | from_json }}"
        bpa_clear_regions: "{{ bpa_modes | dict2items | selectattr('value', 'equalto', 'off')
                               | map(attribute='key') | join(', ') | default('none', true) }}"

  roles:
    - role: infra_vpc
    - role: infra_security_groups
    - role: infra_ec2
    - role: infra_ssh_config
    - role: infra_route53

  post_tasks:
    - name: phase 1 summary
      ansible.builtin.debug:
        msg:
          - "=== Phase 1 Complete ==="
          - "VPC: {{ vpc_id }}"
          - "Bastion EIP: {{ infra_ec2_bastion_eip }}"
          - "Domain: {{ cluster_domain }}"
          - "Topology: {{ ocp_topology }} ({{ ocp_master_count }} master,
             {{ ocp_worker_count }} worker)"
          - "Nodes: {{ ocp_nodes | map(attribute='hostname') | zip(ocp_node_ips)
             | map('join', '=') | join(', ') }}"
          - "VIPs: api {{ api_vip }}, ingress {{ ingress_vip }}"
          - ""
          - "SSH config: {{ infra_ssh_config_file | default('~/.ssh/config.d/disconnected-sandbox') }}"
          - "Test bastion: ssh bastion-sandbox hostname"
          - "Test private: ssh services-sandbox hostname"
          - ""
          - "Next: ansible-playbook playbooks/phase2_configure.yml -i inventory/aws_ec2.yml"
