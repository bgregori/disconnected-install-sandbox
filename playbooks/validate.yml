---
- name: Validate disconnected sandbox — end-to-end checks
  hosts: all
  gather_facts: true

  tasks:
    - name: check fips mode
      ansible.builtin.command:
        cmd: fips-mode-setup --check
      register: fips_status
      changed_when: false
      failed_when: false

    - name: report fips status
      ansible.builtin.debug:
        msg: "FIPS: {{ fips_status.stdout | trim }}"

- name: validate air-gap on private hosts
  hosts: role_services:role_registry:role_kvm
  gather_facts: false

  tasks:
    - name: verify no internet connectivity
      ansible.builtin.wait_for:
        host: google.com
        port: 443
        timeout: 5
        state: started
      register: internet_check
      failed_when: internet_check is succeeded

    - name: confirm air-gap intact
      ansible.builtin.debug:
        msg: "Air-gap confirmed — no internet connectivity from {{ inventory_hostname }}"

# Data volumes mount with nofail, so every way this can go wrong is quiet: the
# host boots, the mount point is an empty directory on the root disk, and
# nothing logs an error. The checks below cover the three states that matter --
# mounted at all, backed by the data volume rather than the root disk, and
# recorded in fstab by UUID so it survives the next NVMe re-enumeration.
- name: validate data volume mounts
  hosts: role_registry:role_kvm
  gather_facts: false
  vars:
    # Spelled out rather than read from the roles: validate.yml applies no
    # roles, so kvm_host's defaults are not in scope here. Keep in step with
    # kvm_host_data_mount (roles/kvm_host/defaults/main.yml) and with
    # phase2_registry_data_mount (playbooks/phase2_configure.yml).
    validate_data_mount: >-
      {{ '/var/lib/libvirt/images'
         if inventory_hostname in (groups['role_kvm'] | default([]))
         else '/data' }}

  tasks:
    - name: check what is mounted at the data mount point
      ansible.builtin.command:
        cmd: findmnt -n -o SOURCE {{ validate_data_mount }}
      register: validate_data_source
      changed_when: false
      failed_when: false

    - name: assert data volume is mounted
      ansible.builtin.assert:
        that:
          - validate_data_source.rc == 0
        fail_msg: >-
          Nothing is mounted at {{ validate_data_mount }} on
          {{ inventory_hostname }}. The fstab entry is nofail, so the host
          booted past this without complaining. Check that the entry names a
          UUID rather than a device path, and that `blkid` still reports that
          UUID on an attached volume.
        success_msg: >-
          {{ validate_data_mount }} is mounted from
          {{ validate_data_source.stdout | trim }}

    # Walks each mount back to its whole-disk parent (a partition reports its
    # disk in PKNAME; a whole-disk device reports nothing, so fall back to the
    # device itself). If the two agree, the data mount is sitting on the root
    # disk -- which is exactly what a device-path fstab entry produces once
    # AWS renumbers the NVMe devices across a reboot.
    - name: resolve the backing disks for the data mount and for /
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          parent_disk() {
            src=$(findmnt -nr -o SOURCE --target "$1" | head -1)
            case "$src" in
              /dev/*) ;;
              *) echo ""; return ;;
            esac
            pk=$(lsblk -nro PKNAME "$src" 2>/dev/null | head -1)
            if [ -n "$pk" ]; then echo "$pk"; else echo "${src#/dev/}"; fi
          }
          printf '{"data": "%s", "root": "%s"}\n' \
            "$(parent_disk {{ validate_data_mount }})" "$(parent_disk /)"
        executable: /bin/bash
      register: validate_data_disks
      changed_when: false

    - name: assert the data mount is not backed by the root disk
      ansible.builtin.assert:
        that:
          - validate_disks.data | length > 0
          - validate_disks.data != validate_disks.root
        fail_msg: >-
          {{ validate_data_mount }} is backed by /dev/{{ validate_disks.data }},
          which is also the disk carrying / on {{ inventory_hostname }}. The
          data volume is not mounted -- something is reading and writing the
          root disk under a path that is supposed to be the data volume.
        success_msg: >-
          {{ validate_data_mount }} is on /dev/{{ validate_disks.data }},
          separate from the root disk /dev/{{ validate_disks.root }}
      vars:
        validate_disks: "{{ validate_data_disks.stdout | from_json }}"

    - name: read fstab
      ansible.builtin.slurp:
        src: /etc/fstab
      register: validate_fstab

    # Mounted right now is not the same as mounted after the next reboot. A
    # device-path entry can be correct today and wrong tomorrow, so the entry
    # itself has to be a UUID.
    - name: assert fstab records the data volume by uuid
      ansible.builtin.assert:
        that:
          - validate_fstab_line | length > 0
          - validate_fstab_line is search('^\s*UUID=')
        fail_msg: >-
          The /etc/fstab entry for {{ validate_data_mount }} on
          {{ inventory_hostname }} is
          {{ validate_fstab_line | default('missing', true) }}. It must name a
          UUID: AWS NVMe device names are assigned in attach order and move
          across reboots, so a device path here will eventually point at the
          root disk.
        success_msg: >-
          fstab pins {{ validate_data_mount }} by UUID
          ({{ validate_fstab_line.split() | first }})
      vars:
        validate_fstab_line: >-
          {{ (validate_fstab.content | b64decode).splitlines()
             | select('search', '^\s*[^#\s]\S*\s+'
                      ~ (validate_data_mount | regex_escape) ~ '\s')
             | first | default('') | trim }}

- name: validate dns service
  hosts: role_services:role_registry:role_kvm
  gather_facts: false

  tasks:
    - name: resolve api endpoint
      ansible.builtin.command:
        cmd: "getent ahosts api.{{ cluster_domain }}"
      register: dns_api
      changed_when: false

    - name: resolve wildcard apps
      ansible.builtin.command:
        cmd: "getent ahosts test.apps.{{ cluster_domain }}"
      register: dns_apps
      changed_when: false

    - name: resolve registry
      ansible.builtin.command:
        cmd: "getent ahosts registry.{{ cluster_domain }}"
      register: dns_registry
      changed_when: false

- name: validate ntp service
  hosts: role_services:role_registry:role_kvm
  gather_facts: false

  tasks:
    - name: check chrony sync status
      ansible.builtin.command:
        cmd: chronyc tracking
      register: ntp_status
      changed_when: false

    - name: report ntp status
      ansible.builtin.debug:
        msg: "NTP: {{ ntp_status.stdout_lines[0] | default('unknown') }}"

- name: validate haproxy on bastion
  hosts: role_bastion
  gather_facts: false
  vars:
    ansible_ssh_common_args: ""

  tasks:
    - name: check haproxy stats
      ansible.builtin.uri:
        url: http://127.0.0.1:9000/haproxy-stats
        return_content: false
      register: haproxy_status

    - name: check haproxy is listening
      ansible.builtin.command:
        cmd: ss -tlnp
      register: haproxy_ports
      changed_when: false

    - name: assert haproxy ports are bound
      ansible.builtin.assert:
        that:
          - "':6443' in haproxy_ports.stdout"
          - "':443' in haproxy_ports.stdout"
        fail_msg: "HAProxy is not listening on required ports"
        success_msg: "HAProxy is bound to :6443 and :443"

- name: validate kvm host and redfish bmc
  hosts: role_kvm
  gather_facts: false

  tasks:
    - name: verify libvirtd is running
      ansible.builtin.systemd:
        name: libvirtd
        state: started
      check_mode: true
      register: validate_libvirtd
      failed_when: validate_libvirtd.changed

    - name: list all vm domains
      ansible.builtin.command:
        cmd: virsh list --all --name
      register: validate_virsh_list
      changed_when: false

    - name: assert ocp node vms are defined
      ansible.builtin.assert:
        that:
          - item.name in validate_virsh_list.stdout_lines
        fail_msg: "VM {{ item.name }} not found. Got: {{ validate_virsh_list.stdout }}"
        success_msg: "VM {{ item.name }} ({{ item.role }}) is defined"
      loop: "{{ ocp_nodes }}"
      loop_control:
        label: "{{ item.name }}"

    - name: verify sushy-emulator is running
      ansible.builtin.systemd:
        name: sushy-emulator
        state: started
      check_mode: true
      register: validate_sushy
      failed_when: validate_sushy.changed

    - name: verify redfish api responds
      ansible.builtin.uri:
        url: "http://{{ kvm_private_ip }}:{{ redfish_port }}/redfish/v1/"
        method: GET
        status_code: 200
      register: validate_redfish

    - name: verify redfish lists systems
      ansible.builtin.uri:
        url: "http://{{ kvm_private_ip }}:{{ redfish_port }}/redfish/v1/Systems/"
        method: GET
        return_content: true
        status_code: 200
      register: validate_redfish_systems

    - name: report redfish systems count
      ansible.builtin.debug:
        msg: "Redfish BMC: {{ validate_redfish_systems.json.Members | length }} systems registered"

- name: validate route53 records
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  tasks:
    - name: resolve api via public dns
      ansible.builtin.command:
        cmd: "dig +short api.{{ cluster_name }}.{{ sandbox_domain }}"
      register: r53_api
      changed_when: false

    - name: resolve wildcard apps via public dns
      ansible.builtin.command:
        cmd: "dig +short test.apps.{{ cluster_name }}.{{ sandbox_domain }}"
      register: r53_apps
      changed_when: false

    - name: display route53 validation
      ansible.builtin.debug:
        msg:
          - "api.{{ cluster_name }}.{{ sandbox_domain }} → {{ r53_api.stdout | trim }}"
          - "*.apps.{{ cluster_name }}.{{ sandbox_domain }} → {{ r53_apps.stdout | trim }}"

- name: summary
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  tasks:
    - name: display sandbox readiness summary
      ansible.builtin.debug:
        msg:
          - "=== Disconnected Sandbox Validation Complete ==="
          - ""
          - "Environment: {{ cluster_domain }}"
          - "Bastion EIP: {{ infra_ec2_bastion_eip | default('see Phase 1 output') }}"
          - ""
          - "API endpoint:     https://api.{{ cluster_domain }}:6443"
          - "Console:          https://console-openshift-console.apps.{{ cluster_domain }}"
          - "Registry host:    registry.{{ cluster_domain }} (not yet configured — use mirror-registry)"
          - "{% if enable_kvm_host | default(false) %}KVM host:         kvm.{{ cluster_domain }} (Redfish BMC on :{{ redfish_port }}){% endif %}"
          - ""
          - "The sandbox is ready for disconnected OpenShift 4 installation."
          - "{% if enable_kvm_host | default(false) %}Install method:   Agent-Based Installer (ABI) via Redfish BMC{% endif %}"
