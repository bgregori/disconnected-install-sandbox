---
# Phase 2 - Configure RHEL 9 services on provisioned hosts
# Requires: Phase 1 complete, dynamic inventory populated
# Connection: SSH via bastion ProxyCommand

# Set hostnames on all hosts
- name: set bastion hostname
  hosts: role_bastion
  gather_facts: false
  vars:
    ansible_ssh_common_args: ""
  tasks:
    - name: set hostname to bastion
      ansible.builtin.hostname:
        name: bastion

- name: set private host hostnames
  hosts: role_services:role_registry:role_kvm
  gather_facts: false
  tasks:
    - name: set hostname
      ansible.builtin.hostname:
        name: "{{ sandbox_role_hostnames[aws_tags.sandbox_role] }}"
      vars:
        sandbox_role_hostnames:
          services: services
          registry: registry
          kvm: kvm

# Step 2.0: Set up bastion as local yum repo + content relay
- name: configure bastion as package repo
  hosts: role_bastion
  gather_facts: true
  vars:
    ansible_ssh_common_args: ""
  roles:
    - role: bastion_repo

# Step 2.0.1: Disable RHUI repos and enable bastion local repo on private hosts
- name: configure air-gapped repos on private hosts
  hosts: role_services:role_registry:role_kvm
  gather_facts: false
  tasks:
    - name: disable rhui repos
      ansible.builtin.command:
        cmd: dnf config-manager --disable '*rhui*'
      register: phase2_disable_rhui
      changed_when: "'Nothing to do' not in phase2_disable_rhui.stderr"
      failed_when: false

    - name: configure bastion local repo
      ansible.builtin.yum_repository:
        name: bastion-local
        description: Bastion Local Repository
        baseurl: "http://{{ bastion_private_ip }}:{{ bastion_repo_port }}/rhel9-local"
        enabled: true
        gpgcheck: false

# Step 2.0.2: Format and mount registry data volume
- name: prepare registry data volume
  hosts: role_registry
  gather_facts: false
  tasks:
    - name: check if data volume is already mounted
      ansible.builtin.command:
        cmd: findmnt -n -o SOURCE /data
      register: phase2_registry_existing_mount
      changed_when: false
      failed_when: false

    - name: find data volume device
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          lsblk -dn -o NAME,TYPE | awk '$2 == "disk" {print "/dev/" $1}' | while read dev; do
            if ! lsblk -n -o MOUNTPOINTS "$dev" 2>/dev/null | grep -q '/'; then
              echo "$dev"; break
            fi
          done
        executable: /bin/bash
      register: phase2_registry_data_dev
      changed_when: false
      failed_when: phase2_registry_data_dev.stdout | length == 0
      when: phase2_registry_existing_mount.rc != 0

    - name: set data device fact
      ansible.builtin.set_fact:
        phase2_registry_data_device: >-
          {{ phase2_registry_existing_mount.stdout | trim
             if phase2_registry_existing_mount.rc == 0
             else phase2_registry_data_dev.stdout }}

    - name: show detected data volume
      ansible.builtin.debug:
        msg: "Data volume at {{ phase2_registry_data_device }}"

    - name: create filesystem on data volume
      community.general.filesystem:
        fstype: xfs
        dev: "{{ phase2_registry_data_device }}"

    - name: create data mount point
      ansible.builtin.file:
        path: /data
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: mount data volume
      ansible.posix.mount:
        path: /data
        src: "{{ phase2_registry_data_device }}"
        fstype: xfs
        opts: defaults,nofail
        state: mounted

    - name: set data directory ownership
      ansible.builtin.file:
        path: /data
        owner: ec2-user
        group: ec2-user
        mode: "0755"

    - name: create quay systemd override directory
      ansible.builtin.file:
        path: /home/ec2-user/.config/systemd/user/quay-app.service.d
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "0755"

    - name: create quay-app permissions fix for stig umask
      ansible.builtin.copy:
        content: |
          [Service]
          ExecStartPre=/bin/bash -c 'chmod -R 755 /data/quay/quay-config /data/quay/quay-rootCA 2>/dev/null; chmod 644 /data/quay/quay-config/* /data/quay/quay-rootCA/* 2>/dev/null; true'
        dest: /home/ec2-user/.config/systemd/user/quay-app.service.d/fix-perms.conf
        owner: ec2-user
        group: ec2-user
        mode: "0644"

# Step 2.1: Enable FIPS on all hosts (requires reboot)
- name: enable fips on bastion
  hosts: role_bastion
  gather_facts: false
  vars:
    ansible_ssh_common_args: ""
  roles:
    - role: rhel_hardening
      rhel_hardening_apply_stig: false

- name: enable fips on private hosts
  hosts: role_services:role_registry:role_kvm
  gather_facts: false
  pre_tasks:
    # The bastion just rebooted for FIPS. Every connection to these hosts is a
    # ProxyCommand tunnel through it, and ansible.cfg multiplexes with
    # ControlPersist=60s -- so sockets cached by earlier plays still point at
    # a tunnel whose far end no longer exists. Reusing one fails as "Data
    # could not be sent to remote host ... Connection closed by UNKNOWN port
    # 65535", which reads as though the private host is down when in fact it
    # is the jump host that moved.
    #
    # The bastion's reboot task waits only for the bastion's own connection.
    # Nothing re-establishes the tunnels layered on top of it, so do that here.
    - name: drop ssh sockets that tunnelled through the pre-reboot bastion
      ansible.builtin.meta: reset_connection

    - name: wait for the tunnel to rebuild through the restarted bastion
      ansible.builtin.wait_for_connection:
        timeout: 300
  roles:
    - role: rhel_hardening
      rhel_hardening_apply_stig: false

# Every host has now rebooted into FIPS, which stops sshd offering ed25519 --
# not a FIPS 140-3 approved algorithm. They all present ecdsa/rsa instead, so
# every key recorded before this point is stale and ssh reads the change as
# REMOTE HOST IDENTIFICATION HAS CHANGED.
#
# The playbook itself tolerates that (StrictHostKeyChecking=no, matching
# ansible.cfg), but the ~/.ssh/config.d/disconnected-sandbox stanzas written
# by infra_ssh_config use accept-new, which refuses a changed key -- so
# `ssh bastion-sandbox` by hand would fail after a run that otherwise worked.
#
# The file is sandbox-scoped and disposable by design. Drop it and let the
# next connection repopulate it with the FIPS-era keys.
- name: discard pre-fips host keys
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: remove stale sandbox known_hosts
      ansible.builtin.file:
        path: "{{ sandbox_known_hosts }}"
        state: absent

# Step 2.2: Configure DNS server
- name: configure bind dns on services host
  hosts: role_services
  gather_facts: true
  roles:
    - role: bind_dns

# Step 2.3: Configure NTP server
- name: configure chrony ntp on services host
  hosts: role_services
  gather_facts: false
  roles:
    - role: chrony_ntp

# Step 2.4: Configure DNS/NTP clients on all private hosts
- name: configure dns and ntp clients
  hosts: role_services:role_registry:role_kvm
  gather_facts: false
  roles:
    - role: common_client

# Step 2.4.1: Configure bastion to use internal DNS (with AWS fallback)
- name: configure bastion dns client
  hosts: role_bastion
  gather_facts: false
  vars:
    ansible_ssh_common_args: ""
  tasks:
    - name: disable networkmanager dns management
      ansible.builtin.copy:
        content: |
          [main]
          dns=none
        dest: /etc/NetworkManager/conf.d/90-dns-none.conf
        owner: root
        group: root
        mode: "0644"
      notify: reload networkmanager

    - name: configure dns resolver with internal and aws fallback
      ansible.builtin.copy:
        content: |
          search {{ cluster_domain }}
          nameserver {{ services_private_ip }}
          nameserver 10.0.0.2
        dest: /etc/resolv.conf
        owner: root
        group: root
        mode: "0644"

  handlers:
    - name: reload networkmanager
      ansible.builtin.systemd:
        name: NetworkManager
        state: reloaded

# Step 2.4.2: Generate bastion-to-private SSH key and distribute to internal hosts
- name: generate bastion internal ssh key
  hosts: role_bastion
  gather_facts: false
  vars:
    ansible_ssh_common_args: ""
    bastion_internal_key: /home/ec2-user/.ssh/bastion-internal
  tasks:
    - name: generate ssh key pair for internal access
      community.crypto.openssh_keypair:
        path: "{{ bastion_internal_key }}"
        type: ecdsa
        size: 521
        owner: ec2-user
        group: ec2-user
        mode: "0600"
        comment: "bastion-internal@{{ cluster_domain }}"
      register: bastion_internal_keypair

    - name: read public key
      ansible.builtin.slurp:
        src: "{{ bastion_internal_key }}.pub"
      register: bastion_internal_pubkey

    - name: configure bastion ssh client for internal hosts
      ansible.builtin.copy:
        content: |
          Host services services.{{ cluster_domain }}
            HostName {{ services_private_ip }}
            User ec2-user
            IdentityFile {{ bastion_internal_key }}
            StrictHostKeyChecking no

          Host registry registry.{{ cluster_domain }}
            HostName {{ registry_private_ip }}
            User ec2-user
            IdentityFile {{ bastion_internal_key }}
            StrictHostKeyChecking no

          Host kvm kvm.{{ cluster_domain }}
            HostName {{ kvm_private_ip }}
            User ec2-user
            IdentityFile {{ bastion_internal_key }}
            StrictHostKeyChecking no
        dest: /home/ec2-user/.ssh/config
        owner: ec2-user
        group: ec2-user
        mode: "0600"

- name: distribute bastion public key to private hosts
  hosts: role_services:role_registry:role_kvm
  gather_facts: false
  tasks:
    - name: authorize bastion internal key
      ansible.posix.authorized_key:
        user: ec2-user
        key: "{{ hostvars[groups['role_bastion'][0]]['bastion_internal_pubkey']['content'] | b64decode }}"
        state: present

# Step 2.5: Configure HAProxy ingress on bastion
- name: configure bastion haproxy
  hosts: role_bastion
  gather_facts: false
  vars:
    ansible_ssh_common_args: ""
  roles:
    - role: bastion_haproxy

# Step 2.6: Configure KVM host with libvirt and OCP VMs
- name: configure kvm host
  hosts: role_kvm
  gather_facts: true
  roles:
    - role: kvm_host

# Step 2.7: Configure Redfish BMC emulator on KVM host
- name: configure redfish bmc
  hosts: role_kvm
  gather_facts: false
  roles:
    - role: redfish_bmc

# Step 2.8: Apply STIG - private hosts first while bastion repo is still serving
- name: apply stig on private hosts
  hosts: role_services:role_registry:role_kvm
  gather_facts: false
  roles:
    - role: rhel_hardening
      rhel_hardening_enable_fips: false
      rhel_hardening_firewall_ports: >-
        {{ (['8443/tcp'] if 'role_registry' in group_names else [])
         + (['8888/tcp', '8000/tcp'] if 'role_kvm' in group_names else [])
         + (['53/tcp', '53/udp', '123/udp'] if 'role_services' in group_names else []) }}

# Step 2.9: Re-apply KVM networking after STIG reboot
- name: restore kvm networking after stig
  hosts: role_kvm
  gather_facts: false
  tasks:
    - name: restart kvm networking service
      ansible.builtin.systemd:
        name: kvm-networking
        state: restarted

- name: apply stig on bastion
  hosts: role_bastion
  gather_facts: false
  vars:
    ansible_ssh_common_args: ""
  roles:
    - role: rhel_hardening
      rhel_hardening_enable_fips: false
      rhel_hardening_firewall_ports:
        - "{{ bastion_repo_port }}/tcp"
        - 6443/tcp
        - 443/tcp
        - 80/tcp
