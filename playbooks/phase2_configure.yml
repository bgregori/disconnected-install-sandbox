---
# Phase 2 - Configure RHEL 9 services on provisioned hosts
# Requires: Phase 1 complete, dynamic inventory populated
# Connection: SSH via bastion ProxyCommand

# Step 2.0.0: Confirm the topology before anything derives from it
#
# ocp_topology drives the BIND records, SSH config and libvirt domains below.
# When -e ocp_topology is omitted it is read back from the KVM host's tag; when
# it is given, it must match that tag. See topology_check.yml.
- name: check topology against the built environment
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: check topology against the built environment
      ansible.builtin.include_tasks: topology_check.yml

# Step 2.0.0a: Start from an empty sandbox known_hosts
#
# The purges after the FIPS reboots below only run on the success path. A host
# lost between `fips-mode-setup --enable` and its reboot is left switched to
# FIPS, and its next restart (an instance stop/start, say) brings it up
# presenting ecdsa instead of the ed25519 key recorded for it. Nothing purges
# that on the next run: if it is the bastion, every private-host tunnel dies
# at the jump hop ("forwarding disabled due to host key check failure") from
# the very first play, long before the first purge; whichever host it is, the
# accept-new stanzas in ~/.ssh/config.d refuse it by hand with REMOTE HOST
# IDENTIFICATION HAS CHANGED.
#
# The file is sandbox-scoped and disposable by design -- it is already purged
# twice per run -- so purge it up front too and let the next connections
# relearn whatever keys the hosts present now. Seen on sandbox830.
- name: discard sandbox host keys left by earlier runs
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: remove sandbox known_hosts
      ansible.builtin.file:
        path: "{{ sandbox_known_hosts }}"
        state: absent

# Step 2.0: Wait for every managed host to answer SSH
#
# FIRST, before any play targets a host. An unreachable host is not a
# recoverable failure in Ansible: it is dropped from the play and from every
# play that follows, so the run finishes green with that host untouched. The
# damage surfaces much later and somewhere else -- a missing libvirt, an
# empty trust anchor directory -- with nothing pointing back to a connection
# that was refused twenty minutes earlier.
#
# The KVM host is the one that provokes it. infra_ec2 waits on
# `ec2_instance`, which returns when EC2 reports the instance running, and an
# m5.metal reaches that state minutes before sshd is listening -- bare metal
# POST is not quick. site.yml then waits only for the bastion before
# importing this playbook, so on a cold build the hostname play below can
# reach role_kvm while it is still powering on.
#
# Costs nothing on a host that is already up, which is the usual case when
# this playbook is run on its own.
- name: wait for every host to answer ssh
  hosts: role_bastion:role_services:role_registry:role_kvm
  gather_facts: false
  become: false
  tasks:
    - name: wait for ssh to answer
      ansible.builtin.wait_for_connection:
        timeout: "{{ host_ssh_wait_timeout }}"

# Set hostnames on all hosts
- name: set bastion hostname
  hosts: role_bastion
  gather_facts: false
  vars:
    ansible_ssh_common_args: ""
  tasks:
    - name: set hostname to bastion
      ansible.builtin.hostname:
        name: bastion

- name: set private host hostnames
  hosts: role_services:role_registry:role_kvm
  gather_facts: false
  tasks:
    - name: set hostname
      ansible.builtin.hostname:
        name: "{{ sandbox_role_hostnames[aws_tags.sandbox_role] }}"
      vars:
        sandbox_role_hostnames:
          services: services
          registry: registry
          kvm: kvm

# Step 2.0.0: Establish the environment root of trust
#
# FIRST, and the ordering is load-bearing. Every TLS endpoint that follows
# chains to this root, including the bastion package repo -- and a host
# cannot install packages over a connection it does not yet trust. The role
# is deliberately dependency-free for exactly this reason: creating the CA
# happens on the controller, and trusting it is a file copy plus
# update-ca-trust, both of which work on a base image with no repo at all.
- name: establish the environment pki
  hosts: role_bastion:role_services:role_registry:role_kvm
  gather_facts: false
  roles:
    - role: pki

# Step 2.0.0b: Certificates for the registry and the cluster
#
# Issued now rather than when those steps happen, so that whoever stands up
# the mirror registry or runs the installer finds a certificate from this
# environment's root already waiting. The alternative is what produced the
# three unrelated CAs this PKI replaced: reach the step, find nothing, make
# something self-signed.
#
# localhost only -- none of these belong to a host Ansible manages.
- name: issue certificates for the registry and the cluster
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: issue the cluster certificate artifacts
      ansible.builtin.include_role:
        name: pki
        tasks_from: cluster_artifacts.yml

# Step 2.0: Set up bastion as local yum repo + content relay
- name: configure bastion as package repo
  hosts: role_bastion
  gather_facts: true
  vars:
    ansible_ssh_common_args: ""
  roles:
    - role: bastion_repo

# Step 2.0.1: Disable RHUI repos and enable bastion local repo on private hosts
- name: configure air-gapped repos on private hosts
  hosts: role_services:role_registry:role_kvm
  gather_facts: false
  tasks:
    - name: disable rhui repos
      ansible.builtin.command:
        cmd: dnf config-manager --disable '*rhui*'
      register: phase2_disable_rhui
      changed_when: "'Nothing to do' not in phase2_disable_rhui.stderr"
      failed_when: false

    - name: configure bastion local repo
      ansible.builtin.yum_repository:
        name: bastion-local
        description: Bastion Local Repository
        baseurl: "{{ bastion_repo_url }}/rhel9-local"
        enabled: true
        gpgcheck: false

# Step 2.0.2: Format and mount registry data volume
#
# Detection, formatting, the UUID lookup and the fstab entry all live in the
# data_volume role, shared with the kvm host. See roles/data_volume for why
# the mount is pinned by UUID: a device path here pointed /data at the root
# disk once a STIG reboot renumbered the NVMe devices, and nofail meant the
# host booted quietly with no /data and no error. Observed 2026-10-12.
#
# The mount point and its ownership stay here because they are registry
# business -- quay runs as ec2-user and has to own the filesystem root. The
# role deliberately does not touch either, since the kvm host mounts over a
# directory libvirt already created with its own permissions.
- name: prepare registry data volume
  hosts: role_registry
  gather_facts: false
  vars:
    phase2_registry_data_mount: /data
  tasks:
    # Before the mount, so the directory underneath exists with sane
    # ownership even on a host where the volume never attaches.
    - name: create data mount point
      ansible.builtin.file:
        path: "{{ phase2_registry_data_mount }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # fstype and opts come from the role defaults (xfs, defaults,nofail,nodev),
    # which already match what is on the registry host.
    - name: provision the registry data volume
      ansible.builtin.include_role:
        name: data_volume
      vars:
        data_volume_mount: "{{ phase2_registry_data_mount }}"

    # After the mount, so it lands on the volume's filesystem root rather
    # than the directory it is now hiding.
    - name: set data directory ownership
      ansible.builtin.file:
        path: "{{ phase2_registry_data_mount }}"
        owner: ec2-user
        group: ec2-user
        mode: "0755"

    - name: create quay systemd override directory
      ansible.builtin.file:
        path: /home/ec2-user/.config/systemd/user/quay-app.service.d
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "0755"

    - name: create quay-app permissions fix for stig umask
      ansible.builtin.copy:
        content: |
          [Service]
          ExecStartPre=/bin/bash -c 'chmod -R 755 /data/quay/quay-config /data/quay/quay-rootCA 2>/dev/null; chmod 644 /data/quay/quay-config/* /data/quay/quay-rootCA/* 2>/dev/null; true'
        dest: /home/ec2-user/.config/systemd/user/quay-app.service.d/fix-perms.conf
        owner: ec2-user
        group: ec2-user
        mode: "0644"

# Step 2.1: Enable FIPS on all hosts (requires reboot)
- name: enable fips on bastion
  hosts: role_bastion
  gather_facts: false
  vars:
    ansible_ssh_common_args: ""
  roles:
    - role: rhel_hardening
      rhel_hardening_apply_stig: false

# The bastion came back from its FIPS reboot presenting ecdsa instead of the
# ed25519 key recorded before it, so its known_hosts entry is now a CHANGED
# key. StrictHostKeyChecking=no is not enough to ride that out: ssh still
# completes the login, but it refuses to set up any forwarding --
#
#   Error: forwarding disabled due to host key check failure
#   Connection closed by UNKNOWN port 65535
#
# -- and the ProxyCommand below is `ssh -W`, which is forwarding. So every
# tunnel to a private host dies at the jump hop until the stale bastion key is
# gone. Purge it here, before anything tries to tunnel; the play after the
# private-host reboots purges again for the keys those reboots invalidate.
- name: discard the pre-fips bastion host key
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: remove stale sandbox known_hosts
      ansible.builtin.file:
        path: "{{ sandbox_known_hosts }}"
        state: absent

- name: enable fips on private hosts
  hosts: role_services:role_registry:role_kvm
  gather_facts: false
  pre_tasks:
    # The bastion just rebooted for FIPS. Every connection to these hosts is a
    # ProxyCommand tunnel through it, and ansible.cfg multiplexes with
    # ControlPersist=60s -- so sockets cached by earlier plays still point at
    # a tunnel whose far end no longer exists. Reusing one fails as "Data
    # could not be sent to remote host ... Connection closed by UNKNOWN port
    # 65535", which reads as though the private host is down when in fact it
    # is the jump host that moved.
    #
    # The bastion's reboot task waits only for the bastion's own connection.
    # Nothing re-establishes the tunnels layered on top of it, so do that here.
    - name: drop ssh sockets that tunnelled through the pre-reboot bastion
      ansible.builtin.meta: reset_connection

    - name: wait for the tunnel to rebuild through the restarted bastion
      ansible.builtin.wait_for_connection:
        timeout: 300
  roles:
    - role: rhel_hardening
      rhel_hardening_apply_stig: false

# Every host has now rebooted into FIPS, which stops sshd offering ed25519 --
# not a FIPS 140-3 approved algorithm. They all present ecdsa/rsa instead, so
# every key recorded before this point is stale and ssh reads the change as
# REMOTE HOST IDENTIFICATION HAS CHANGED.
#
# The playbook's own connections tolerate that (StrictHostKeyChecking=no,
# matching ansible.cfg -- these hops do no forwarding, unlike the bastion hop
# handled above), but the ~/.ssh/config.d/disconnected-sandbox stanzas written
# by infra_ssh_config use accept-new, which refuses a changed key -- so
# `ssh bastion-sandbox` by hand would fail after a run that otherwise worked.
#
# The file is sandbox-scoped and disposable by design. Drop it and let the
# next connection repopulate it with the FIPS-era keys.
- name: discard pre-fips host keys
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: remove stale sandbox known_hosts
      ansible.builtin.file:
        path: "{{ sandbox_known_hosts }}"
        state: absent

# Step 2.2: Configure DNS server
- name: configure bind dns on services host
  hosts: role_services
  gather_facts: true
  roles:
    - role: bind_dns

# Step 2.3: Configure NTP server
- name: configure chrony ntp on services host
  hosts: role_services
  gather_facts: false
  roles:
    - role: chrony_ntp

# Step 2.4: Configure DNS/NTP clients on all private hosts
- name: configure dns and ntp clients
  hosts: role_services:role_registry:role_kvm
  gather_facts: false
  roles:
    - role: common_client

# Step 2.4.1: Configure bastion to use internal DNS (with AWS fallback)
- name: configure bastion dns client
  hosts: role_bastion
  gather_facts: false
  vars:
    ansible_ssh_common_args: ""
  tasks:
    - name: disable networkmanager dns management
      ansible.builtin.copy:
        content: |
          [main]
          dns=none
        dest: /etc/NetworkManager/conf.d/90-dns-none.conf
        owner: root
        group: root
        mode: "0644"
      notify: reload networkmanager

    - name: configure dns resolver with internal and aws fallback
      ansible.builtin.copy:
        content: |
          search {{ cluster_domain }}
          nameserver {{ services_private_ip }}
          nameserver 10.0.0.2
        dest: /etc/resolv.conf
        owner: root
        group: root
        mode: "0644"

  handlers:
    - name: reload networkmanager
      ansible.builtin.systemd:
        name: NetworkManager
        state: reloaded

# Step 2.4.2: Generate bastion-to-private SSH key and distribute to internal hosts
- name: generate bastion internal ssh key
  hosts: role_bastion
  gather_facts: false
  vars:
    ansible_ssh_common_args: ""
    bastion_internal_key: /home/ec2-user/.ssh/bastion-internal
  tasks:
    - name: generate ssh key pair for internal access
      community.crypto.openssh_keypair:
        path: "{{ bastion_internal_key }}"
        type: ecdsa
        size: 521
        owner: ec2-user
        group: ec2-user
        mode: "0600"
        comment: "bastion-internal@{{ cluster_domain }}"
      register: bastion_internal_keypair

    - name: read public key
      ansible.builtin.slurp:
        src: "{{ bastion_internal_key }}.pub"
      register: bastion_internal_pubkey

    - name: configure bastion ssh client for internal hosts
      ansible.builtin.copy:
        content: |
          Host services services.{{ cluster_domain }}
            HostName {{ services_private_ip }}
            User ec2-user
            IdentityFile {{ bastion_internal_key }}
            StrictHostKeyChecking no

          Host registry registry.{{ cluster_domain }}
            HostName {{ registry_private_ip }}
            User ec2-user
            IdentityFile {{ bastion_internal_key }}
            StrictHostKeyChecking no

          Host kvm kvm.{{ cluster_domain }}
            HostName {{ kvm_private_ip }}
            User ec2-user
            IdentityFile {{ bastion_internal_key }}
            StrictHostKeyChecking no
        dest: /home/ec2-user/.ssh/config
        owner: ec2-user
        group: ec2-user
        mode: "0600"

- name: distribute bastion public key to private hosts
  hosts: role_services:role_registry:role_kvm
  gather_facts: false
  tasks:
    - name: authorize bastion internal key
      ansible.posix.authorized_key:
        user: ec2-user
        key: "{{ hostvars[groups['role_bastion'][0]]['bastion_internal_pubkey']['content'] | b64decode }}"
        state: present

# Step 2.5: Configure HAProxy ingress on bastion
- name: configure bastion haproxy
  hosts: role_bastion
  gather_facts: false
  vars:
    ansible_ssh_common_args: ""
  roles:
    - role: bastion_haproxy

# Step 2.6: Configure KVM host with libvirt and OCP VMs
- name: configure kvm host
  hosts: role_kvm
  gather_facts: true
  roles:
    - role: kvm_host

# Step 2.7: Configure Redfish BMC emulator on KVM host
- name: configure redfish bmc
  hosts: role_kvm
  gather_facts: false
  roles:
    - role: redfish_bmc

# Step 2.8: Apply STIG - private hosts first while bastion repo is still serving
- name: apply stig on private hosts
  hosts: role_services:role_registry:role_kvm
  gather_facts: false
  roles:
    - role: rhel_hardening
      rhel_hardening_enable_fips: false
      # The keycloak issuer port is deliberately NOT here. keycloak_idp opens
      # it itself, so the role works when run on its own rather than only as
      # part of a full phase 2. These lists only ever add ports -- nothing
      # closes one -- so leaving it to the role costs nothing.
      rhel_hardening_firewall_ports: >-
        {{ (['8443/tcp'] if 'role_registry' in group_names else [])
         + (['8888/tcp', '8000/tcp'] if 'role_kvm' in group_names else [])
         + (['53/tcp', '53/udp', '123/udp']
            if 'role_services' in group_names else []) }}

# Step 2.9: Re-apply KVM networking after STIG reboot
- name: restore kvm networking after stig
  hosts: role_kvm
  gather_facts: false
  tasks:
    - name: restart kvm networking service
      ansible.builtin.systemd:
        name: kvm-networking
        state: restarted

# Step 2.8.1: Keycloak OIDC identity provider on the services host
#
# Deliberately after the private-host STIG pass and before the bastion's.
#
# After, because Keycloak runs in containers and the hardening is what it has
# to survive: fapolicyd blocks the OCI runtime's dynamic loader, SELinux is
# enforcing so every bind mount needs a label, firewalld is closed, and the
# STIG reboot would otherwise land on a freshly-started server. Standing the
# IdP up on the hardened host means the role proves it works there, rather
# than working once and breaking at the next reboot.
#
# Before the bastion's, because the images arrive over HTTP from the bastion
# repo, and STIG's httpd remediation can take that repo down -- the same
# ordering constraint that puts the private hosts first in Step 2.8.
- name: configure keycloak identity provider
  hosts: role_services
  gather_facts: false
  roles:
    - role: keycloak_idp
      when: enable_keycloak_idp | bool

- name: apply stig on bastion
  hosts: role_bastion
  gather_facts: false
  vars:
    ansible_ssh_common_args: ""
  roles:
    - role: rhel_hardening
      rhel_hardening_enable_fips: false
      rhel_hardening_firewall_ports:
        - "{{ bastion_repo_port }}/tcp"
        - 6443/tcp
        - 443/tcp
        - 80/tcp
