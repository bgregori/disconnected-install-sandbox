---
# Phase 2 - Configure RHEL 9 services on provisioned hosts
# Requires: Phase 1 complete, dynamic inventory populated
# Connection: SSH via bastion ProxyCommand

# Step 2.0: Set up bastion as local yum repo + content relay
- name: configure bastion as package repo
  hosts: role_bastion
  gather_facts: true
  vars:
    ansible_ssh_common_args: ""
  roles:
    - role: bastion_repo

# Step 2.0.1: Disable RHUI repos and enable bastion local repo on private hosts
- name: configure air-gapped repos on private hosts
  hosts: role_services:role_registry:role_kvm
  gather_facts: false
  tasks:
    - name: disable rhui repos
      ansible.builtin.command:
        cmd: dnf config-manager --disable '*rhui*'
      register: phase2_disable_rhui
      changed_when: "'Nothing to do' not in phase2_disable_rhui.stderr"
      failed_when: false

    - name: configure bastion local repo
      ansible.builtin.yum_repository:
        name: bastion-local
        description: Bastion Local Repository
        baseurl: "http://{{ bastion_private_ip }}:{{ bastion_repo_port }}/rhel9-local"
        enabled: true
        gpgcheck: false

# Step 2.1: Enable FIPS on all hosts (requires reboot)
- name: enable fips on bastion
  hosts: role_bastion
  gather_facts: false
  vars:
    ansible_ssh_common_args: ""
  roles:
    - role: rhel_hardening
      rhel_hardening_apply_stig: false

- name: enable fips on private hosts
  hosts: role_services:role_registry:role_kvm
  gather_facts: false
  roles:
    - role: rhel_hardening
      rhel_hardening_apply_stig: false

# Step 2.2: Configure DNS server
- name: configure bind dns on services host
  hosts: role_services
  gather_facts: true
  roles:
    - role: bind_dns

# Step 2.3: Configure NTP server
- name: configure chrony ntp on services host
  hosts: role_services
  gather_facts: false
  roles:
    - role: chrony_ntp

# Step 2.4: Configure DNS/NTP clients on all private hosts
- name: configure dns and ntp clients
  hosts: role_services:role_registry:role_kvm
  gather_facts: false
  roles:
    - role: common_client

# Step 2.5: Configure HAProxy ingress on bastion
- name: configure bastion haproxy
  hosts: role_bastion
  gather_facts: false
  vars:
    ansible_ssh_common_args: ""
  roles:
    - role: bastion_haproxy

# Step 2.6: Configure KVM host with libvirt and OCP VMs
- name: configure kvm host
  hosts: role_kvm
  gather_facts: true
  roles:
    - role: kvm_host

# Step 2.7: Configure Redfish BMC emulator on KVM host
- name: configure redfish bmc
  hosts: role_kvm
  gather_facts: false
  roles:
    - role: redfish_bmc

# Step 2.8: Apply STIG - private hosts first while bastion repo is still serving
- name: apply stig on private hosts
  hosts: role_services:role_registry:role_kvm
  gather_facts: false
  roles:
    - role: rhel_hardening
      rhel_hardening_enable_fips: false

- name: apply stig on bastion
  hosts: role_bastion
  gather_facts: false
  vars:
    ansible_ssh_common_args: ""
  roles:
    - role: rhel_hardening
      rhel_hardening_enable_fips: false
