---
- name: Teardown — destroy all disconnected sandbox resources
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  pre_tasks:
    - name: validate required variables
      ansible.builtin.assert:
        that:
          - aws_region is defined and aws_region | length > 0
          - sandbox_domain is defined and sandbox_domain | length > 0
        fail_msg: >-
          Missing required variables. Run with:
          ansible-playbook playbooks/teardown.yml
          -e aws_region=us-east-2
          -e sandbox_domain=example.com

  tasks:
    # Step 1: Find all tagged resources
    - name: find all sandbox ec2 instances
      amazon.aws.ec2_instance_info:
        region: "{{ aws_region }}"
        filters:
          "tag:Project": "{{ project_tag }}"
          instance-state-name:
            - running
            - stopped
      register: sandbox_instances

    - name: find sandbox vpc
      amazon.aws.ec2_vpc_net_info:
        region: "{{ aws_region }}"
        filters:
          "tag:Project": "{{ project_tag }}"
      register: sandbox_vpcs

    # Step 2: Terminate instances
    - name: terminate all sandbox instances
      amazon.aws.ec2_instance:
        instance_ids: "{{ sandbox_instances.instances | map(attribute='instance_id') | list }}"
        region: "{{ aws_region }}"
        state: absent
        wait: true
      when: sandbox_instances.instances | length > 0

    # Step 3: Release Elastic IPs
    - name: find sandbox elastic ips
      amazon.aws.ec2_eip_info:
        region: "{{ aws_region }}"
        filters:
          "tag:Project": "{{ project_tag }}"
      register: sandbox_eips

    - name: disassociate elastic ips
      amazon.aws.ec2_eip:
        public_ip: "{{ item.public_ip }}"
        region: "{{ aws_region }}"
        state: present
        in_vpc: true
        release_on_disassociation: true
      loop: "{{ sandbox_eips.addresses }}"
      when:
        - sandbox_eips.addresses | length > 0
        - item.association_id is defined
      failed_when: false

    - name: release elastic ips
      amazon.aws.ec2_eip:
        public_ip: "{{ item.public_ip }}"
        region: "{{ aws_region }}"
        state: absent
      loop: "{{ sandbox_eips.addresses }}"
      when: sandbox_eips.addresses | length > 0

    # Step 4: Delete key pair
    - name: delete ec2 key pair
      amazon.aws.ec2_key:
        name: "{{ ssh_key_name }}"
        region: "{{ aws_region }}"
        state: absent

    # Step 5: Clean up Route53 records
    - name: find hosted zone for sandbox domain
      amazon.aws.route53_zone:
        zone: "{{ sandbox_domain }}"
        state: present
      register: r53_zone
      failed_when: false

    - name: remove route53 api record
      amazon.aws.route53:
        zone: "{{ sandbox_domain }}"
        record: "api.{{ cluster_name }}.{{ sandbox_domain }}"
        type: A
        state: absent
      failed_when: false
      when: r53_zone is not failed

    - name: remove route53 wildcard apps record
      amazon.aws.route53:
        zone: "{{ sandbox_domain }}"
        record: "*.apps.{{ cluster_name }}.{{ sandbox_domain }}"
        type: A
        state: absent
      failed_when: false
      when: r53_zone is not failed

    # Step 6: Delete VPC and all networking resources
    - name: teardown vpc and all networking
      when: sandbox_vpcs.vpcs | length > 0
      block:
        - name: set vpc id for teardown
          ansible.builtin.set_fact:
            teardown_vpc_id: "{{ sandbox_vpcs.vpcs[0].id }}"

        - name: clean up enis in vpc
          ansible.builtin.include_tasks: teardown_eni_cleanup.yml
          vars:
            teardown_eni_vpc_id: "{{ teardown_vpc_id }}"
            teardown_eni_region: "{{ aws_region }}"

        - name: find all security groups in vpc
          amazon.aws.ec2_security_group_info:
            region: "{{ aws_region }}"
            filters:
              vpc-id: "{{ teardown_vpc_id }}"
          register: sandbox_sgs

        - name: revoke all ingress rules to break circular references
          amazon.aws.ec2_security_group:
            group_id: "{{ item.group_id }}"
            region: "{{ aws_region }}"
            rules: []
            purge_rules: true
          loop: "{{ sandbox_sgs.security_groups | rejectattr('group_name', 'equalto', 'default') | list }}"
          loop_control:
            label: "{{ item.group_name }}"
          failed_when: false

        - name: revoke all egress rules to break circular references
          amazon.aws.ec2_security_group:
            group_id: "{{ item.group_id }}"
            region: "{{ aws_region }}"
            rules_egress: []
            purge_rules_egress: true
          loop: "{{ sandbox_sgs.security_groups | rejectattr('group_name', 'equalto', 'default') | list }}"
          loop_control:
            label: "{{ item.group_name }}"
          failed_when: false

        - name: delete non-default security groups
          amazon.aws.ec2_security_group:
            group_id: "{{ item.group_id }}"
            region: "{{ aws_region }}"
            state: absent
          loop: "{{ sandbox_sgs.security_groups | rejectattr('group_name', 'equalto', 'default') | list }}"
          loop_control:
            label: "{{ item.group_name }}"
          failed_when: false

        - name: find sandbox subnets
          amazon.aws.ec2_vpc_subnet_info:
            region: "{{ aws_region }}"
            filters:
              vpc-id: "{{ teardown_vpc_id }}"
              "tag:Project": "{{ project_tag }}"
          register: sandbox_subnets

        - name: delete subnets
          amazon.aws.ec2_vpc_subnet:
            vpc_id: "{{ teardown_vpc_id }}"
            cidr: "{{ item.cidr_block }}"
            region: "{{ aws_region }}"
            state: absent
          loop: "{{ sandbox_subnets.subnets }}"
          retries: 5
          delay: 30
          until: subnet_delete is not failed
          register: subnet_delete

        - name: find and delete non-main route tables
          amazon.aws.ec2_vpc_route_table_info:
            region: "{{ aws_region }}"
            filters:
              vpc-id: "{{ teardown_vpc_id }}"
              "tag:Project": "{{ project_tag }}"
          register: sandbox_rts

        - name: delete route tables
          amazon.aws.ec2_vpc_route_table:
            route_table_id: "{{ item.id }}"
            vpc_id: "{{ teardown_vpc_id }}"
            region: "{{ aws_region }}"
            lookup: id
            state: absent
          loop: "{{ sandbox_rts.route_tables }}"
          when: not item.associations | selectattr('main', 'defined') | selectattr('main') | list | length > 0
          failed_when: false

        # Non-default NACLs, peerings and egress-only gateways block DeleteVpc
        # the same way subnets do, and nothing above removes them.
        - name: find non-default network acls
          amazon.aws.ec2_vpc_nacl_info:
            region: "{{ aws_region }}"
            filters:
              vpc-id: "{{ teardown_vpc_id }}"
          register: sandbox_nacls

        - name: delete non-default network acls
          amazon.aws.ec2_vpc_nacl:
            nacl_id: "{{ item.nacl_id }}"
            region: "{{ aws_region }}"
            state: absent
          loop: >-
            {{ sandbox_nacls.nacls | default([])
               | rejectattr('is_default') | list }}
          loop_control:
            label: "{{ item.nacl_id }}"
          failed_when: false

        - name: find vpc peering connections
          amazon.aws.ec2_vpc_peering_info:
            region: "{{ aws_region }}"
            filters:
              requester-vpc-info.vpc-id: "{{ teardown_vpc_id }}"
          register: sandbox_peerings

        - name: delete vpc peering connections
          amazon.aws.ec2_vpc_peering:
            peering_id: "{{ item.vpc_peering_connection_id }}"
            region: "{{ aws_region }}"
            state: absent
          loop: >-
            {{ sandbox_peerings.vpc_peering_connections | default([])
               | rejectattr('status.code', 'in', ['deleted', 'deleting']) | list }}
          loop_control:
            label: "{{ item.vpc_peering_connection_id }}"
          failed_when: false

        - name: delete egress-only internet gateway
          amazon.aws.ec2_vpc_egress_igw:
            vpc_id: "{{ teardown_vpc_id }}"
            region: "{{ aws_region }}"
            state: absent
          failed_when: false

        - name: detach and delete internet gateway
          amazon.aws.ec2_vpc_igw:
            vpc_id: "{{ teardown_vpc_id }}"
            region: "{{ aws_region }}"
            state: absent

        # Security groups are deleted above with `failed_when: false`, so a
        # failure there stays invisible until DeleteVpc reports
        # DependencyViolation and names nothing. Retry them now that every
        # ENI is gone -- an SG still attached to an interface cannot be
        # deleted, which is the usual reason the first pass failed.
        - name: re-check security groups in vpc
          amazon.aws.ec2_security_group_info:
            region: "{{ aws_region }}"
            filters:
              vpc-id: "{{ teardown_vpc_id }}"
          register: check_sgs

        - name: delete any security group left behind
          amazon.aws.ec2_security_group:
            group_id: "{{ item.group_id }}"
            region: "{{ aws_region }}"
            state: absent
          loop: >-
            {{ check_sgs.security_groups
               | rejectattr('group_name', 'equalto', 'default') | list }}
          loop_control:
            label: "{{ item.group_name }}"
          register: sg_retry
          retries: 3
          delay: 10
          until: sg_retry is not failed
          failed_when: false

        - name: confirm nothing is left holding the vpc
          block:
            - name: final security group check
              amazon.aws.ec2_security_group_info:
                region: "{{ aws_region }}"
                filters:
                  vpc-id: "{{ teardown_vpc_id }}"
              register: final_sgs

            - name: final subnet check
              amazon.aws.ec2_vpc_subnet_info:
                region: "{{ aws_region }}"
                filters:
                  vpc-id: "{{ teardown_vpc_id }}"
              register: final_subnets

            - name: final network interface check
              amazon.aws.ec2_eni_info:
                region: "{{ aws_region }}"
                filters:
                  vpc-id: "{{ teardown_vpc_id }}"
              register: final_enis

        - name: fail with what still blocks the vpc delete
          vars:
            leftover_sgs: >-
              {{ final_sgs.security_groups
                 | rejectattr('group_name', 'equalto', 'default') | list }}
          ansible.builtin.fail:
            msg: |
              VPC {{ teardown_vpc_id }} still has dependencies, so DeleteVpc
              cannot succeed. Remaining:

                security groups   : {{ leftover_sgs | map(attribute='group_name') | join(', ') or 'none' }}
                subnets           : {{ final_subnets.subnets | map(attribute='id') | join(', ') or 'none' }}
                network interfaces: {{ final_enis.network_interfaces | map(attribute='id') | join(', ') or 'none' }}

              Security groups most often survive because they reference each
              other, so neither can be deleted until the rule between them is
              revoked. Deleting them by hand in any order and re-running this
              playbook clears it.
          when: >-
            leftover_sgs | length > 0
            or final_subnets.subnets | length > 0
            or final_enis.network_interfaces | length > 0

        - name: delete vpc
          amazon.aws.ec2_vpc_net:
            vpc_id: "{{ teardown_vpc_id }}"
            region: "{{ aws_region }}"
            state: absent

    # Step 8: Clean up local files
    - name: remove local ssh private key
      ansible.builtin.file:
        path: "{{ ssh_key_path }}"
        state: absent

    - name: remove local ssh public key
      ansible.builtin.file:
        path: "{{ ssh_key_path }}.pub"
        state: absent

    - name: remove ssh config stanza
      ansible.builtin.file:
        path: "~/.ssh/config.d/disconnected-sandbox"
        state: absent

    - name: remove sandbox known_hosts
      ansible.builtin.file:
        path: "~/.ssh/known_hosts.disconnected-sandbox"
        state: absent

    - name: teardown complete
      ansible.builtin.debug:
        msg: "All disconnected-sandbox resources destroyed in {{ aws_region }}"
