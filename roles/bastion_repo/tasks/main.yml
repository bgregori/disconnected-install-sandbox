---
- name: install repo tooling
  ansible.builtin.dnf:
    name:
      - httpd
      - createrepo
      - yum-utils
    state: present

- name: create repo directory
  ansible.builtin.file:
    path: "{{ bastion_repo_base_dir }}/{{ bastion_repo_name }}"
    state: directory
    owner: apache
    group: apache
    mode: "0755"

- name: download packages with all dependencies
  ansible.builtin.command:
    cmd: >-
      dnf download
      --resolve
      --alldeps
      --destdir={{ bastion_repo_base_dir }}/{{ bastion_repo_name }}
      {{ bastion_repo_packages | join(' ') }}
  register: dnf_download
  changed_when: "'No package downloaded' not in dnf_download.stdout"

- name: create repo metadata
  ansible.builtin.command:
    cmd: "createrepo {{ bastion_repo_base_dir }}/{{ bastion_repo_name }}"
  changed_when: true

- name: configure httpd to listen on repo port
  ansible.builtin.template:
    src: repo-httpd.conf.j2
    dest: /etc/httpd/conf.d/repo.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart httpd

- name: configure selinux for custom httpd port
  ansible.builtin.command:
    cmd: "semanage port -a -t http_port_t -p tcp {{ bastion_repo_port }}"
  register: semanage_result
  changed_when: semanage_result.rc == 0
  failed_when: semanage_result.rc != 0 and 'already defined' not in semanage_result.stderr

- name: enable and start httpd
  ansible.builtin.systemd:
    name: httpd
    enabled: true
    state: started

- name: open firewall for repo port
  ansible.posix.firewalld:
    port: "{{ bastion_repo_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  ignore_errors: true
