---
bastion_repo_port: "{{ bastion_repo_port }}"
bastion_repo_base_dir: /var/www/html/repos
bastion_repo_name: rhel9-local

bastion_repo_packages:
  - openscap-scanner
  - scap-security-guide
  - libxslt
  - bind
  - bind-utils
  - chrony
  - tmux
  - tcpdump
  - nmap-ncat
  - fapolicyd
  - firewalld
  - aide
  - rsyslog
  - audit
  - policycoreutils-python-utils
  - nmstate
  # Keycloak and its database run as containers on the services host, which
  # can reach neither a registry nor a RHEL repo of its own.
  - podman
  # community.crypto's backend, for the issuer CA and serving certificate.
  - python3-cryptography

# The rpm subpackages are versioned in lockstep -- each carries
# `Requires: rpm-libs(x86-64) = <exact nevr>`. `dnf download --resolve` only
# walks forward dependencies, so mirroring fapolicyd pulls
# rpm-plugin-fapolicyd and its dep rpm-libs at the newest release, but none of
# the siblings that require rpm-libs back. On an air-gapped host still at the
# AMI's older release that is unsolvable -- dnf refuses to upgrade rpm-libs
# because it would orphan the siblings, and `dnf install fapolicyd` fails with
# "cannot install both rpm-libs-<new> and rpm-libs-<old>". STIG remediation of
# RHEL-09-433010/433015 then errors out and fapolicyd never lands.
# Mirror the whole stack so it upgrades as a unit.
bastion_repo_rpm_stack_packages:
  - rpm
  - rpm-libs
  - rpm-build-libs
  - rpm-sign-libs
  - python3-rpm
  - rpm-plugin-audit
  - rpm-plugin-selinux
  - rpm-plugin-systemd-inhibit

bastion_repo_kvm_packages:
  - qemu-kvm
  - libvirt
  - libvirt-client
  - virt-install
  - python3-libvirt
  - python3-pip

bastion_repo_enable_kvm: "{{ enable_kvm_host }}"
bastion_repo_pip_wheel_dir: "{{ bastion_repo_base_dir }}/pip-wheels"

# Container images for the air-gapped services host. Same relay as the RPMs
# and the pip wheels: the bastion is the only host with internet and with
# registry credentials, so it pulls, `podman save`s to a tar, and lets httpd
# serve the tar out of the document root it already has.
bastion_repo_stage_container_images: "{{ enable_keycloak_idp }}"
bastion_repo_container_dir: "{{ bastion_repo_base_dir }}/{{ bastion_repo_container_dir_name }}"
bastion_repo_container_images: "{{ keycloak_image_archives }}"

# registry.redhat.io needs credentials. Point this at a container auth file
# on the OPERATOR WORKSTATION -- the Red Hat pull secret, or the auth.json
# that `podman login registry.redhat.io` writes to $XDG_RUNTIME_DIR. It is
# never committed; pass it at run time:
#
#   -e bastion_repo_registry_auth_file=~/pull-secret.json
#
# Set bastion_repo_stage_container_images=false to skip the whole thing if
# the sandbox does not need the identity provider.
bastion_repo_registry_auth_file: ""
bastion_repo_registry_auth_dest: /root/.config/containers/registry-pull-auth.json
