---
- name: validate required facts from infra_vpc
  ansible.builtin.assert:
    that:
      - infra_security_groups_vpc_id is defined and infra_security_groups_vpc_id | length > 0
      - admin_cidr is defined and admin_cidr | length > 0
    fail_msg: "vpc_id and admin_cidr must be available (run infra_vpc first, pass admin_cidr via -e)"

# sg-bastion has no SG cross-references — create first
- name: create bastion security group
  amazon.aws.ec2_security_group:
    name: "{{ infra_security_groups_project_tag }}-bastion"
    description: "Bastion host + HAProxy ingress"
    vpc_id: "{{ infra_security_groups_vpc_id }}"
    region: "{{ infra_security_groups_region }}"
    rules:
      - proto: tcp
        ports: 22
        cidr_ip: "{{ infra_security_groups_admin_cidr }}"
        rule_desc: "SSH from operator workstation"
      - proto: tcp
        ports: 443
        cidr_ip: "0.0.0.0/0"
        rule_desc: "HAProxy — OCP apps ingress"
      - proto: tcp
        ports: 6443
        cidr_ip: "0.0.0.0/0"
        rule_desc: "HAProxy — OCP Kubernetes API"
      - proto: tcp
        ports: 80
        cidr_ip: "0.0.0.0/0"
        rule_desc: "HAProxy — OCP HTTP redirect"
      - proto: tcp
        ports: "{{ infra_security_groups_bastion_repo_port }}"
        cidr_ip: "{{ infra_security_groups_private_subnet_cidr }}"
        rule_desc: "Local yum repo for air-gapped hosts"
    rules_egress:
      - proto: tcp
        ports: 22
        cidr_ip: "{{ infra_security_groups_private_subnet_cidr }}"
        rule_desc: "SSH to private subnet hosts"
      - proto: tcp
        ports: 443
        cidr_ip: "0.0.0.0/0"
        rule_desc: "HTTPS — download content/packages"
      - proto: tcp
        ports: 80
        cidr_ip: "0.0.0.0/0"
        rule_desc: "HTTP — download content/packages"
      - proto: tcp
        ports: 6443
        cidr_ip: "{{ infra_security_groups_private_subnet_cidr }}"
        rule_desc: "HAProxy backend — OCP API"
      - proto: tcp
        ports: 53
        cidr_ip: "{{ infra_security_groups_services_ip }}/32"
        rule_desc: "DNS to services host"
      - proto: udp
        ports: 53
        cidr_ip: "{{ infra_security_groups_services_ip }}/32"
        rule_desc: "DNS to services host"
      - proto: tcp
        ports: 8443
        cidr_ip: "{{ infra_security_groups_registry_ip }}/32"
        rule_desc: "Registry HTTPS — oc mirror content push"
    tags:
      Name: "{{ infra_security_groups_project_tag }}-bastion"
      Project: "{{ infra_security_groups_project_tag }}"
      Environment: sandbox
    state: present
  register: infra_security_groups_bastion_result

- name: create services security group
  amazon.aws.ec2_security_group:
    name: "{{ infra_security_groups_project_tag }}-services"
    description: "DNS + NTP services host"
    vpc_id: "{{ infra_security_groups_vpc_id }}"
    region: "{{ infra_security_groups_region }}"
    rules:
      - proto: tcp
        ports: 22
        group_id: "{{ infra_security_groups_bastion_result.group_id }}"
        rule_desc: "SSH from bastion"
      - proto: tcp
        ports: 53
        cidr_ip: "{{ infra_security_groups_vpc_cidr }}"
        rule_desc: "DNS TCP from VPC"
      - proto: udp
        ports: 53
        cidr_ip: "{{ infra_security_groups_vpc_cidr }}"
        rule_desc: "DNS UDP from VPC"
      - proto: udp
        ports: 123
        cidr_ip: "{{ infra_security_groups_private_subnet_cidr }}"
        rule_desc: "NTP from private subnet"
    rules_egress:
      - proto: all
        cidr_ip: "{{ infra_security_groups_vpc_cidr }}"
        rule_desc: "VPC-internal only — no internet"
    tags:
      Name: "{{ infra_security_groups_project_tag }}-services"
      Project: "{{ infra_security_groups_project_tag }}"
      Environment: sandbox
    state: present
  register: infra_security_groups_services_result

- name: create registry security group
  amazon.aws.ec2_security_group:
    name: "{{ infra_security_groups_project_tag }}-registry"
    description: "Mirror container registry host"
    vpc_id: "{{ infra_security_groups_vpc_id }}"
    region: "{{ infra_security_groups_region }}"
    rules:
      - proto: tcp
        ports: 22
        group_id: "{{ infra_security_groups_bastion_result.group_id }}"
        rule_desc: "SSH from bastion"
      - proto: tcp
        ports: 5000
        cidr_ip: "{{ infra_security_groups_private_subnet_cidr }}"
        rule_desc: "Registry HTTP"
      - proto: tcp
        ports: 8443
        cidr_ip: "{{ infra_security_groups_private_subnet_cidr }}"
        rule_desc: "Registry HTTPS from private subnet"
      - proto: tcp
        ports: 8443
        group_id: "{{ infra_security_groups_bastion_result.group_id }}"
        rule_desc: "Registry HTTPS from bastion — oc mirror content push"
    rules_egress:
      - proto: tcp
        ports: 53
        cidr_ip: "{{ infra_security_groups_services_ip }}/32"
        rule_desc: "DNS to services host"
      - proto: udp
        ports: 53
        cidr_ip: "{{ infra_security_groups_services_ip }}/32"
        rule_desc: "DNS to services host"
      - proto: udp
        ports: 123
        cidr_ip: "{{ infra_security_groups_services_ip }}/32"
        rule_desc: "NTP to services host"
      - proto: tcp
        ports: "{{ infra_security_groups_bastion_repo_port }}"
        cidr_ip: "{{ infra_security_groups_bastion_ip }}/32"
        rule_desc: "Bastion local yum repo"
    tags:
      Name: "{{ infra_security_groups_project_tag }}-registry"
      Project: "{{ infra_security_groups_project_tag }}"
      Environment: sandbox
    state: present
  register: infra_security_groups_registry_result

# OCP nodes SG — created in two passes to handle self-reference
- name: create ocp nodes security group shell
  amazon.aws.ec2_security_group:
    name: "{{ infra_security_groups_project_tag }}-ocp-nodes"
    description: "OpenShift 4 compact cluster nodes"
    vpc_id: "{{ infra_security_groups_vpc_id }}"
    region: "{{ infra_security_groups_region }}"
    rules: []
    rules_egress: []
    purge_rules: false
    purge_rules_egress: false
    tags:
      Name: "{{ infra_security_groups_project_tag }}-ocp-nodes"
      Project: "{{ infra_security_groups_project_tag }}"
      Environment: sandbox
    state: present
  register: infra_security_groups_ocp_nodes_shell

- name: apply ocp nodes security group rules
  amazon.aws.ec2_security_group:
    name: "{{ infra_security_groups_project_tag }}-ocp-nodes"
    description: "OpenShift 4 compact cluster nodes"
    vpc_id: "{{ infra_security_groups_vpc_id }}"
    region: "{{ infra_security_groups_region }}"
    rules:
      # SSH from bastion
      - proto: tcp
        ports: 22
        group_id: "{{ infra_security_groups_bastion_result.group_id }}"
        rule_desc: "SSH from bastion"
      # External-facing (from VPC)
      - proto: tcp
        ports: 80
        cidr_ip: "{{ infra_security_groups_private_subnet_cidr }}"
        rule_desc: "HTTP routes"
      - proto: tcp
        ports: 443
        cidr_ip: "{{ infra_security_groups_private_subnet_cidr }}"
        rule_desc: "HTTPS routes"
      - proto: tcp
        ports: 6443
        cidr_ip: "{{ infra_security_groups_vpc_cidr }}"
        rule_desc: "Kubernetes API"
      - proto: tcp
        ports: 22623
        cidr_ip: "{{ infra_security_groups_private_subnet_cidr }}"
        rule_desc: "Machine Config Server"
      # Inter-node (self-referencing)
      - proto: tcp
        ports: 2379-2380
        group_id: "{{ infra_security_groups_ocp_nodes_shell.group_id }}"
        rule_desc: "etcd server + peer"
      - proto: tcp
        ports: 9000-9999
        group_id: "{{ infra_security_groups_ocp_nodes_shell.group_id }}"
        rule_desc: "Host-level services"
      - proto: tcp
        ports: 10250
        group_id: "{{ infra_security_groups_ocp_nodes_shell.group_id }}"
        rule_desc: "Kubelet API"
      - proto: tcp
        ports: 10257
        group_id: "{{ infra_security_groups_ocp_nodes_shell.group_id }}"
        rule_desc: "kube-controller-manager"
      - proto: tcp
        ports: 10259
        group_id: "{{ infra_security_groups_ocp_nodes_shell.group_id }}"
        rule_desc: "kube-scheduler"
      - proto: udp
        ports: 4789
        group_id: "{{ infra_security_groups_ocp_nodes_shell.group_id }}"
        rule_desc: "VXLAN OVN-Kubernetes"
      - proto: udp
        ports: 6081
        group_id: "{{ infra_security_groups_ocp_nodes_shell.group_id }}"
        rule_desc: "Geneve OVN-Kubernetes"
      - proto: udp
        ports: 500
        group_id: "{{ infra_security_groups_ocp_nodes_shell.group_id }}"
        rule_desc: "IPsec IKE"
      - proto: udp
        ports: 4500
        group_id: "{{ infra_security_groups_ocp_nodes_shell.group_id }}"
        rule_desc: "IPsec NAT-T"
      - proto: tcp
        ports: 30000-32767
        cidr_ip: "{{ infra_security_groups_private_subnet_cidr }}"
        rule_desc: "NodePort TCP"
      - proto: udp
        ports: 30000-32767
        cidr_ip: "{{ infra_security_groups_private_subnet_cidr }}"
        rule_desc: "NodePort UDP"
    rules_egress:
      # Infrastructure services
      - proto: tcp
        ports: 53
        cidr_ip: "{{ infra_security_groups_services_ip }}/32"
        rule_desc: "DNS to services host"
      - proto: udp
        ports: 53
        cidr_ip: "{{ infra_security_groups_services_ip }}/32"
        rule_desc: "DNS to services host"
      - proto: udp
        ports: 123
        cidr_ip: "{{ infra_security_groups_services_ip }}/32"
        rule_desc: "NTP to services host"
      # Registry
      - proto: tcp
        ports: 5000
        cidr_ip: "{{ infra_security_groups_registry_ip }}/32"
        rule_desc: "Registry HTTP"
      - proto: tcp
        ports: 8443
        cidr_ip: "{{ infra_security_groups_registry_ip }}/32"
        rule_desc: "Registry HTTPS"
      # Bastion local yum repo
      - proto: tcp
        ports: "{{ infra_security_groups_bastion_repo_port }}"
        cidr_ip: "{{ infra_security_groups_bastion_ip }}/32"
        rule_desc: "Bastion local yum repo"
      # Inter-node (self-referencing)
      - proto: tcp
        ports: 2379-2380
        group_id: "{{ infra_security_groups_ocp_nodes_shell.group_id }}"
        rule_desc: "etcd"
      - proto: tcp
        ports: 6443
        group_id: "{{ infra_security_groups_ocp_nodes_shell.group_id }}"
        rule_desc: "Kubernetes API"
      - proto: tcp
        ports: 10250
        group_id: "{{ infra_security_groups_ocp_nodes_shell.group_id }}"
        rule_desc: "Kubelet"
      - proto: udp
        ports: 4789
        group_id: "{{ infra_security_groups_ocp_nodes_shell.group_id }}"
        rule_desc: "VXLAN"
      - proto: udp
        ports: 6081
        group_id: "{{ infra_security_groups_ocp_nodes_shell.group_id }}"
        rule_desc: "Geneve"
      - proto: tcp
        ports: 9000-9999
        group_id: "{{ infra_security_groups_ocp_nodes_shell.group_id }}"
        rule_desc: "Host services"
      - proto: tcp
        ports: 22623
        group_id: "{{ infra_security_groups_ocp_nodes_shell.group_id }}"
        rule_desc: "Machine Config Server"
    tags:
      Name: "{{ infra_security_groups_project_tag }}-ocp-nodes"
      Project: "{{ infra_security_groups_project_tag }}"
      Environment: sandbox
    state: present
  register: infra_security_groups_ocp_nodes_result

- name: validate ocp nodes egress has no internet route
  ansible.builtin.assert:
    that:
      - >-
        infra_security_groups_ocp_nodes_result.ip_permissions_egress
        | selectattr('ip_ranges', 'defined')
        | map(attribute='ip_ranges') | flatten
        | selectattr('cidr_ip', 'equalto', '0.0.0.0/0')
        | list | length == 0
    fail_msg: "FATAL: OCP nodes SG has 0.0.0.0/0 egress — air-gap violated"
    success_msg: "OCP nodes SG confirmed — no internet egress"

- name: export security group facts for downstream roles # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    sg_bastion_id: "{{ infra_security_groups_bastion_result.group_id }}"
    sg_services_id: "{{ infra_security_groups_services_result.group_id }}"
    sg_registry_id: "{{ infra_security_groups_registry_result.group_id }}"
    sg_ocp_nodes_id: "{{ infra_security_groups_ocp_nodes_result.group_id }}"
