---
# Order matters and is the order they are listed in: the database has to be
# back before Keycloak retries its connection. The systemd daemon-reload that
# regenerates the Quadlet units is a task, not a handler, because the units
# have to exist before anything in containers.yml can reference them.
- name: restart keycloak postgres
  ansible.builtin.systemd:
    name: "{{ keycloak_idp_postgres_service }}"
    state: restarted

- name: restart keycloak
  ansible.builtin.systemd:
    name: "{{ keycloak_idp_service }}"
    state: restarted

- name: update ca trust
  ansible.builtin.command:
    cmd: update-ca-trust extract
  changed_when: true
