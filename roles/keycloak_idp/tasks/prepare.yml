---
# ROOTLESS, and that is not a style preference.
#
# On the STIG'd hosts in this sandbox a rootful container cannot start at all:
# `crun --version` run as root dies with
#
#   error while loading shared libraries: libsystemd.so.0:
#   cannot open shared object file: Operation not permitted
#
# while the same binary run as ec2-user prints its version. Measured
# 2026-10-12 on all four hosts. The cause was not identified -- fapolicyd has
# the documented allowances loaded, crun and libsystemd are both in its trust
# database, its compiled ruleset contains `allow perm=open all : all`, SELinux
# is exonerated (it fails identically under runcon -t unconfined_t), and no
# subsystem logs an audit record. Root is simply more restricted than an
# unprivileged user here.
#
# Rootless is also the proven pattern on this fleet rather than a guess: the
# registry host runs Quay, PostgreSQL and Redis as rootless ec2-user
# containers on an equally hardened host.
#
# Consequences that shaped the rest of this role: units live under the user's
# ~/.config/containers/systemd, systemd calls need scope=user, the user needs
# lingering so the units survive logout and come back at boot, and both units
# set UserNS=keep-id so the UID each image expects resolves to this user
# instead of an unrelated subuid.

- name: install container and crypto tooling from the bastion local repo
  ansible.builtin.dnf:
    name:
      - podman
      - python3-cryptography
    state: present

# Resolved here, not in containers.yml, because tls.yml notifies the restart
# handlers before containers.yml ever runs -- and those handlers need this.
- name: read the service user's uid
  ansible.builtin.getent:
    database: passwd
    key: "{{ keycloak_idp_user }}"

- name: set the user systemd environment
  ansible.builtin.set_fact:
    keycloak_idp_user_env:
      XDG_RUNTIME_DIR: "/run/user/{{ getent_passwd[keycloak_idp_user][1] }}"

# Fail here rather than three task files later. Everything between this and
# the first container start writes real state -- a CA, a serving certificate,
# generated secrets, a rendered realm -- and discovering the runtime is
# unusable after all that is what made this role so slow to debug.
- name: check the container runtime actually works for the service user
  ansible.builtin.command:
    cmd: "{{ keycloak_idp_runtime_probe }}"
  become: true
  become_user: "{{ keycloak_idp_user }}"
  register: keycloak_idp_runtime_check
  changed_when: false
  failed_when: false

- name: assert the container runtime is usable
  ansible.builtin.assert:
    that:
      - keycloak_idp_runtime_check.rc == 0
    fail_msg: >-
      The OCI runtime will not start as {{ keycloak_idp_user }} on
      {{ inventory_hostname }}: {{ keycloak_idp_runtime_check.stderr
      | default(keycloak_idp_runtime_check.stdout) | default('no output') | trim }}.
      Nothing below can work until that does. On a STIG'd host this is usually
      fapolicyd -- see roles/rhel_hardening/tasks/oci_runtime.yml -- and
      `fapolicyd --debug-deny --permissive` names the rule responsible.
    success_msg: "OCI runtime usable as {{ keycloak_idp_user }}"

# Quadlet -- systemd units generated from .container files -- arrived in
# podman 4.4 (RHEL 9.2). Everything below is written as Quadlet units, so an
# older podman would silently generate nothing at all: the files would sit in
# the quadlet directory and systemctl would report no such unit. Fail here
# with the version instead.
- name: read the installed podman version
  ansible.builtin.command:
    cmd: podman --version
  register: keycloak_idp_podman_version
  changed_when: false

- name: assert podman is new enough for quadlet
  ansible.builtin.assert:
    that:
      - keycloak_idp_podman_version.stdout.split()[2] is version('4.4', '>=')
    fail_msg: >-
      podman {{ keycloak_idp_podman_version.stdout.split()[2] | default('unknown') }}
      does not support Quadlet (.container units), which needs 4.4 or newer.
    success_msg: "podman {{ keycloak_idp_podman_version.stdout.split()[2] }} supports Quadlet"

# Without lingering the user manager stops at logout and takes the containers
# with it, and nothing starts at boot -- [Install] WantedBy=default.target in
# a user unit only means anything while that manager is running.
- name: enable lingering so the user units survive logout and reboot
  ansible.builtin.command:
    cmd: loginctl enable-linger {{ keycloak_idp_user }}
    creates: "/var/lib/systemd/linger/{{ keycloak_idp_user }}"

- name: create keycloak directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ keycloak_idp_user }}"
    group: "{{ keycloak_idp_user }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ keycloak_idp_conf_dir }}"
      mode: "0755"
    # Read inside the container as UID 1000 in group 0, which maps back to
    # the service user itself under rootless, so owner access is enough.
    - path: "{{ keycloak_idp_container_cert_dir }}"
      mode: "0750"
    - path: "{{ keycloak_idp_import_dir }}"
      mode: "0750"
    - path: "{{ keycloak_idp_state_dir }}"
      mode: "0755"
    - path: "{{ keycloak_idp_image_dir }}"
      mode: "0755"
    - path: "{{ keycloak_idp_quadlet_dir }}"
      mode: "0755"
  loop_control:
    label: "{{ item.path }}"

# The PostgreSQL image is hard-committed to UID 26 -- the upstream Dockerfile
# says so in as many words and has a test enforcing it -- and it writes here.
#
# Plain service-user ownership is correct because the unit sets
# UserNS=keep-id:uid=26, which presents this user to the container as UID 26.
# Without that mapping the host user would be container UID 0 and the image's
# UID 26 would be an unrelated subuid with no access -- which is exactly how
# this failed the first time.
- name: create the postgres data directory
  ansible.builtin.file:
    path: "{{ keycloak_idp_pgdata_dir }}"
    state: directory
    owner: "{{ keycloak_idp_user }}"
    group: "{{ keycloak_idp_user }}"
    mode: "0700"
