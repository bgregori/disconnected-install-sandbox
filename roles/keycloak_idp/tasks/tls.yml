---
# The issuer's serving certificate, from the environment root CA.
#
# This role used to run a private CA of its own, which worked but left the
# sandbox with two unrelated roots -- one here and one from the registry --
# and made the consuming cluster trust a CA that signed exactly one
# certificate. The environment CA replaces it: the cluster trusts one root
# and gets every sandbox endpoint with it, not just the issuer.
#
# Let's Encrypt was never an option here regardless: the services host has
# no internet and the name resolves only inside the VPC. And a self-signed
# leaf would not do, because OpenShift's OIDC config takes a CA bundle
# ConfigMap rather than a leaf pin.

- name: issue the keycloak serving certificate
  ansible.builtin.include_role:
    name: pki
    tasks_from: issue.yml
  vars:
    pki_issue_name: keycloak
    pki_issue_common_name: "{{ keycloak_idp_hostname }}"
    pki_issue_dir: "{{ keycloak_idp_pki_dir }}"
    pki_issue_owner: root
    pki_issue_group: root
    # The names anything might dial the issuer by. keycloak.<domain> is the
    # one in the issuer URL and the only one the cluster cares about; the
    # rest stop an operator poking at it from the bastion by host name or IP
    # getting a name mismatch and concluding the service is broken.
    pki_issue_sans:
      - "DNS:{{ keycloak_idp_hostname }}"
      - "DNS:services.{{ cluster_domain }}"
      - "IP:{{ keycloak_idp_bind_ip }}"

# Copies, not the originals: the issued key stays root-owned in
# /etc/pki/keycloak, while the container needs to read the serving pair as
# the rootless service user. UserNS=keep-id:uid=1000,gid=0 on the unit
# presents that user to the container as 1000:0 -- the UID the image runs
# as -- so owner-only access is enough and the key stays 0600.
- name: stage serving material where the container can read it
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    remote_src: true
    owner: "{{ keycloak_idp_user }}"
    group: "{{ keycloak_idp_user }}"
    mode: "{{ item.mode }}"
  loop:
    - src: "{{ keycloak_idp_pki_dir }}/keycloak.crt"
      dest: "{{ keycloak_idp_container_cert_dir }}/tls.crt"
      mode: "0644"
    - src: "{{ keycloak_idp_pki_dir }}/keycloak.key"
      dest: "{{ keycloak_idp_container_cert_dir }}/tls.key"
      mode: "0600"
  loop_control:
    label: "{{ item.dest }}"
  notify: restart keycloak

# sandbox_ca_cert_path rather than the pki role's own pki_trust_anchor_path:
# role defaults are only in scope during an include_role, so referencing one
# after the include returns leaves it undefined. The global in all.yml is
# what that default is built from anyway.
#
# The root is already a system trust anchor on every host via the pki role,
# so there is nothing to add here. Publishing a copy at the documented path
# keeps keycloak_ca_cert_path meaningful for validate.yml and for the
# operator handing a bundle to the cluster -- it is now the environment
# root rather than an issuer-specific CA.
- name: publish the issuer ca at the documented path
  ansible.builtin.copy:
    src: "{{ sandbox_ca_cert_path }}"
    dest: "{{ keycloak_idp_ca_cert_path }}"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
