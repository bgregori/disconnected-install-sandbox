---
# Every password this role needs is generated on the services host on first
# run and then left alone. Nothing is committed, nothing is passed on the
# command line, and nothing lands in the Ansible log.
#
# Generate-if-absent rather than generate-every-time: the passwords are
# already baked into the realm Keycloak imported and into the database it
# wrote, so rotating them on a re-run would lock the server out of its own
# data. The files on disk are the source of truth after run one.

- name: create keycloak secret directory
  ansible.builtin.file:
    path: "{{ keycloak_idp_secret_dir }}"
    state: directory
    owner: "{{ keycloak_idp_user }}"
    group: "{{ keycloak_idp_user }}"
    mode: "0700"

- name: check which secrets already exist
  ansible.builtin.stat:
    path: "{{ keycloak_idp_secret_dir }}/{{ item }}"
  loop: "{{ keycloak_idp_secret_names }}"
  register: keycloak_idp_secret_stat

- name: generate missing secrets
  ansible.builtin.copy:
    content: >-
      {{ lookup('community.general.random_string',
                length=keycloak_idp_secret_length, special=false,
                min_lower=1, min_upper=1, min_numeric=1) }}
    dest: "{{ keycloak_idp_secret_dir }}/{{ item.item }}"
    owner: "{{ keycloak_idp_user }}"
    group: "{{ keycloak_idp_user }}"
    mode: "0600"
  loop: "{{ keycloak_idp_secret_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not item.stat.exists
  no_log: true

- name: read the generated secrets
  ansible.builtin.slurp:
    src: "{{ keycloak_idp_secret_dir }}/{{ item }}"
  loop: "{{ keycloak_idp_secret_names }}"
  register: keycloak_idp_secret_slurp
  no_log: true

# A name -> value map so the templates below can say
# keycloak_idp_secrets['db-password'] instead of indexing into loop results.
- name: assemble the secret map
  ansible.builtin.set_fact:
    keycloak_idp_secrets: >-
      {{ dict(keycloak_idp_secret_names
              | zip(keycloak_idp_secret_slurp.results
                    | map(attribute='content')
                    | map('b64decode')
                    | map('trim'))) }}
  no_log: true
