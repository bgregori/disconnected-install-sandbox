---
# Passwords go in EnvironmentFiles rather than Environment= lines so the
# Quadlet units stay readable by anyone who can read /etc/containers/systemd
# without handing them the database and the bootstrap admin account.
- name: write the postgres environment file
  ansible.builtin.copy:
    content: |
      POSTGRESQL_PASSWORD={{ keycloak_idp_secrets['db-password'] }}
    dest: "{{ keycloak_idp_conf_dir }}/postgres.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: restart keycloak postgres

- name: write the keycloak environment file
  ansible.builtin.copy:
    content: |
      KC_DB_PASSWORD={{ keycloak_idp_secrets['db-password'] }}
      KC_BOOTSTRAP_ADMIN_PASSWORD={{ keycloak_idp_secrets['bootstrap-admin-password'] }}
    dest: "{{ keycloak_idp_conf_dir }}/keycloak.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: restart keycloak

- name: deploy the quadlet units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ keycloak_idp_quadlet_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - keycloak.network
    - keycloak-postgres.container
    - keycloak.container
  register: keycloak_idp_units
  notify:
    - restart keycloak postgres
    - restart keycloak

# Quadlet is a systemd generator: the .container files above become units
# only when systemd re-runs its generators. Nothing below can reference
# {{ keycloak_idp_service }} until this has happened, which is why it is a
# task and not a handler.
- name: reload systemd so quadlet generates the units # noqa: no-handler
  ansible.builtin.systemd:
    daemon_reload: true
  when: keycloak_idp_units is changed

# Quadlet rejects an entire .container file if it contains one key it does not
# recognise, and says so only on stderr during generation. systemd is then
# simply unaware of the unit, and the next task fails with "Could not find the
# requested service", which points nowhere near the actual cause. Ask the
# generator directly and surface its own error message instead.
# systemctl rather than the systemd module: the module can start or stop a
# unit but cannot answer "does this unit exist", and asking it would fail with
# the same unhelpful message this check exists to replace.
- name: check that quadlet generated both container units # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: systemctl cat {{ item }}
  loop:
    - "{{ keycloak_idp_postgres_service }}"
    - "{{ keycloak_idp_service }}"
  register: keycloak_idp_unit_check
  changed_when: false
  failed_when: false

- name: report what quadlet made of the unit files
  ansible.builtin.command:
    cmd: /usr/libexec/podman/quadlet -dryrun
  register: keycloak_idp_quadlet_dryrun
  changed_when: false
  failed_when: false
  when: keycloak_idp_unit_check.results | selectattr('rc', 'ne', 0) | list | length > 0

- name: assert quadlet generated both container units
  ansible.builtin.assert:
    that:
      - keycloak_idp_unit_check.results | selectattr('rc', 'ne', 0) | list | length == 0
    fail_msg: >-
      Quadlet did not generate
      {{ keycloak_idp_unit_check.results | selectattr('rc', 'ne', 0)
         | map(attribute='item') | join(', ') }}
      from {{ keycloak_idp_quadlet_dir }}. The generator usually rejects a
      whole file over a single unsupported key. It reported:
      {{ keycloak_idp_quadlet_dryrun.stderr | default('(no output)') | trim }}
    success_msg: "quadlet generated both container units"

# No `enabled: true` on either of these. Quadlet units are transient and
# cannot be systemctl-enabled -- `[Install] WantedBy=multi-user.target` in
# the .container file is what makes them start at boot, and it is applied
# when the generator runs.
- name: start the postgres container
  ansible.builtin.systemd:
    name: "{{ keycloak_idp_postgres_service }}"
    state: started

- name: wait for postgres to accept connections
  ansible.builtin.command:
    cmd: >-
      podman exec {{ keycloak_idp_postgres_container_name }}
      pg_isready -U {{ keycloak_idp_db_user }} -d {{ keycloak_idp_db_name }}
  register: keycloak_idp_pg_ready
  retries: 30
  delay: 5
  until: keycloak_idp_pg_ready.rc == 0
  changed_when: false

- name: start keycloak
  ansible.builtin.systemd:
    name: "{{ keycloak_idp_service }}"
    state: started

# Pick up any restart queued by a changed certificate, environment file or
# unit before the verification tasks start probing the server.
- name: apply pending restarts before verifying
  ansible.builtin.meta: flush_handlers

- name: open the firewall for the issuer port
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ keycloak_idp_firewall_ports }}"
