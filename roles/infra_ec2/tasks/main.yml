---
- name: validate required facts from upstream roles
  ansible.builtin.assert:
    that:
      - vpc_id is defined
      - public_subnet_id is defined
      - private_subnet_id is defined
      - sg_bastion_id is defined
      - sg_services_id is defined
      - sg_registry_id is defined
    fail_msg: "Run infra_vpc and infra_security_groups before infra_ec2"

- name: find latest rhel 9 ami
  amazon.aws.ec2_ami_info:
    region: "{{ infra_ec2_region }}"
    owners:
      - "{{ infra_ec2_ami_owner }}"
    filters:
      name: "{{ infra_ec2_ami_name_filter }}"
      architecture: x86_64
      state: available
  register: infra_ec2_ami_result

- name: select most recent ami
  ansible.builtin.set_fact:
    infra_ec2_rhel9_ami_id: "{{ (infra_ec2_ami_result.images | sort(attribute='creation_date') | last).image_id }}"

- name: create ec2 key pair
  amazon.aws.ec2_key:
    name: "{{ infra_ec2_key_name }}"
    region: "{{ infra_ec2_region }}"
    state: present
    tags:
      Project: "{{ infra_ec2_project_tag }}"
      Environment: sandbox
  register: infra_ec2_key_pair_result
  notify: save private key to local file

- name: flush handlers to save key before provisioning instances
  ansible.builtin.meta: flush_handlers

- name: include bastion provisioning
  ansible.builtin.include_tasks: bastion.yml

- name: include private host provisioning
  ansible.builtin.include_tasks: private_hosts.yml

- name: include kvm host provisioning
  ansible.builtin.include_tasks: kvm.yml
  when: infra_ec2_enable_kvm | bool
