---
rhel_hardening_enable_fips: true
rhel_hardening_apply_stig: true
rhel_hardening_stig_profile: xccdf_org.ssgproject.content_profile_stig
rhel_hardening_stig_datastream: /usr/share/xml/scap/ssg/content/ssg-rhel9-ds.xml
rhel_hardening_stig_results_dir: /var/log/openscap
rhel_hardening_audit_backlog_limit: 65536
rhel_hardening_audit_max_log_file: 100
rhel_hardening_audit_num_logs: 20
rhel_hardening_audit_admin_space_left_action: SYSLOG
rhel_hardening_reboot_timeout: 1200
rhel_hardening_firewall_ports: []

# Write Red Hat's documented fapolicyd allowances for the OCI runtime after
# STIG remediation. Every containerised workload on a hardened host needs
# these, so they belong with the hardening rather than in a workload role.
# See tasks/oci_runtime.yml for what they are and what is NOT proven about
# them. Set false to leave fapolicyd exactly as STIG configured it.
rhel_hardening_allow_oci_runtime: true

# Bastion repo for air-gapped package installation
rhel_hardening_bastion_repo_url: "{{ bastion_repo_url }}/{{ bastion_repo_name | default('rhel9-local') }}"
