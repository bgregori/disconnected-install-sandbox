---
- name: install openscap packages
  ansible.builtin.dnf:
    name:
      - openscap-scanner
      - scap-security-guide
    state: present

- name: create results directory
  ansible.builtin.file:
    path: "{{ rhel_hardening_stig_results_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: check if stig datastream exists
  ansible.builtin.stat:
    path: "{{ rhel_hardening_stig_datastream }}"
  register: rhel_hardening_stig_ds

- name: assert stig datastream is available
  ansible.builtin.assert:
    that:
      - rhel_hardening_stig_ds.stat.exists
    fail_msg: >-
      STIG datastream not found at {{ rhel_hardening_stig_datastream }}.
      Ensure scap-security-guide is installed.

- name: apply stig remediation and preserve ansible sudo access
  ansible.builtin.shell:
    cmd: |
      oscap xccdf eval \
        --remediate \
        --profile {{ rhel_hardening_stig_profile }} \
        --results {{ rhel_hardening_stig_results_dir }}/stig-remediation.xml \
        --report {{ rhel_hardening_stig_results_dir }}/stig-remediation.html \
        {{ rhel_hardening_stig_datastream }}
      oscap_rc=$?
      echo '{{ ansible_user | default("ec2-user") }} ALL=(ALL) NOPASSWD: ALL' \
        > /etc/sudoers.d/99-ansible-user
      chmod 0440 /etc/sudoers.d/99-ansible-user
      exit $oscap_rc
  register: rhel_hardening_stig_remediation
  failed_when: rhel_hardening_stig_remediation.rc == 1
  changed_when: rhel_hardening_stig_remediation.rc == 2

- name: increase audit backlog limit in stig rules
  ansible.builtin.lineinfile:
    path: /etc/audit/rules.d/audit.rules
    regexp: '^-b\s+'
    line: "-b {{ rhel_hardening_audit_backlog_limit }}"

- name: remove separate backlog rules file if present
  ansible.builtin.file:
    path: /etc/audit/rules.d/99-backlog.rules
    state: absent

- name: tune auditd configuration for heavy workloads
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - regexp: '^max_log_file\s*='
      line: "max_log_file = {{ rhel_hardening_audit_max_log_file }}"
    - regexp: '^num_logs\s*='
      line: "num_logs = {{ rhel_hardening_audit_num_logs }}"
    - regexp: '^admin_space_left_action\s*='
      line: "admin_space_left_action = {{ rhel_hardening_audit_admin_space_left_action }}"

- name: install tmux for long-running operations
  ansible.builtin.dnf:
    name: tmux
    state: present

- name: create tmux config directory
  ansible.builtin.file:
    path: "/home/{{ ansible_user | default('ec2-user') }}/.config"
    state: directory
    owner: "{{ ansible_user | default('ec2-user') }}"
    group: "{{ ansible_user | default('ec2-user') }}"
    mode: "0700"

- name: configure tmux to survive stig shell timeout
  ansible.builtin.copy:
    content: |
      set -g remain-on-exit on
      bind-key R respawn-pane -k
    dest: "/home/{{ ansible_user | default('ec2-user') }}/.tmux.conf"
    owner: "{{ ansible_user | default('ec2-user') }}"
    group: "{{ ansible_user | default('ec2-user') }}"
    mode: "0644"

- name: re-open firewall ports after stig remediation
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ rhel_hardening_firewall_ports }}"
  when: rhel_hardening_firewall_ports | length > 0

- name: enable persistent journal
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"

- name: reboot after stig remediation # noqa: no-handler
  ansible.builtin.reboot:
    reboot_timeout: "{{ rhel_hardening_reboot_timeout }}"
    msg: "Rebooting after STIG remediation"
  when: rhel_hardening_stig_remediation is changed

- name: generate post-remediation compliance report
  ansible.builtin.command:
    cmd: >-
      oscap xccdf eval
      --profile {{ rhel_hardening_stig_profile }}
      --results {{ rhel_hardening_stig_results_dir }}/stig-compliance.xml
      --report {{ rhel_hardening_stig_results_dir }}/stig-compliance.html
      {{ rhel_hardening_stig_datastream }}
  register: rhel_hardening_stig_compliance
  failed_when: rhel_hardening_stig_compliance.rc == 1
  changed_when: false

- name: display stig compliance summary
  ansible.builtin.debug:
    msg:
      - "STIG compliance report: {{ rhel_hardening_stig_results_dir }}/stig-compliance.html"
      - "oscap exit code: {{ rhel_hardening_stig_compliance.rc }} (0=all pass, 2=some findings remain)"
