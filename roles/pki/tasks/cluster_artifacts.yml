---
# Certificates for the two things this repo does NOT stand up itself: the
# mirror registry, and the OpenShift cluster's API and ingress. Both are
# handled by separate work, and both will want a certificate from this
# environment's root when that work happens.
#
# Issuing them up front costs nothing and removes the step where someone
# reaches that point, finds no certificate, and generates a self-signed one
# -- which is exactly how the sandbox ended up with three unrelated roots
# in the first place.
#
# Everything lands in artifacts/pki/cluster/, which is gitignored.

- name: create the cluster artifacts directory
  ansible.builtin.file:
    path: "{{ pki_artifacts_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true

# The mirror registry. mirror-registry takes --sslCert/--sslKey, and the
# cluster pulls every image through this endpoint, so the CA behind it is
# what additionalTrustBundle below has to carry.
- name: issue the mirror registry certificate
  ansible.builtin.include_tasks: issue_local.yml
  vars:
    pki_local_name: registry
    pki_local_common_name: "registry.{{ cluster_domain }}"
    pki_local_sans:
      - "DNS:registry.{{ cluster_domain }}"
      - "IP:{{ registry_private_ip }}"

# The API server. api-int is the in-cluster name and is a separate SAN, not
# an alias -- the control plane talks to itself by that name.
- name: issue the openshift api certificate
  ansible.builtin.include_tasks: issue_local.yml
  vars:
    pki_local_name: api
    pki_local_common_name: "api.{{ cluster_domain }}"
    pki_local_sans:
      - "DNS:api.{{ cluster_domain }}"
      - "DNS:api-int.{{ cluster_domain }}"
      - "IP:{{ api_vip }}"

# The default ingress wildcard. One level only -- *.apps matches
# console-openshift-console.apps but not anything deeper, which is how
# OpenShift's default ingress certificate is scoped too.
- name: issue the openshift ingress wildcard certificate
  ansible.builtin.include_tasks: issue_local.yml
  vars:
    pki_local_name: ingress
    pki_local_common_name: "*.apps.{{ cluster_domain }}"
    pki_local_sans:
      - "DNS:*.apps.{{ cluster_domain }}"
      - "IP:{{ ingress_vip }}"

# additionalTrustBundle is what makes a disconnected install work at all:
# the installer and every node use it to verify the mirror registry before
# they can pull a single image. Wrong or missing, the cluster fails to
# bootstrap with image pull errors that do not mention certificates.
#
# Emitted as a ready-to-paste install-config fragment rather than a bare
# PEM, because the indentation is the part people get wrong.
- name: write the install-config additionalTrustBundle fragment
  ansible.builtin.copy:
    content: |
      # Generated by roles/pki -- paste into install-config.yaml.
      #
      # This is the sandbox root CA. It signs the mirror registry, the
      # Keycloak issuer, the bastion package repo and the Redfish BMC, so
      # one bundle covers every TLS endpoint the cluster will meet.
      additionalTrustBundle: |
      {{ lookup('file', pki_ca_cert_path) | indent(2, true) }}
    dest: "{{ pki_artifacts_dir }}/install-config-additionalTrustBundle.yaml"
    mode: "0644"
  delegate_to: localhost
  become: false
  run_once: true

- name: write the artifact readme
  ansible.builtin.template:
    src: cluster-artifacts-README.md.j2
    dest: "{{ pki_artifacts_dir }}/README.md"
    mode: "0644"
  delegate_to: localhost
  become: false
  run_once: true

- name: report what was produced
  ansible.builtin.debug:
    msg:
      - "Cluster certificate artifacts in {{ pki_artifacts_dir }}:"
      - "  registry.crt/.key  mirror-registry --sslCert/--sslKey"
      - "  api.crt/.key       APIServer namedCertificates"
      - "  ingress.crt/.key   IngressController default certificate"
      - "  install-config-additionalTrustBundle.yaml"
      - "See README.md there for the commands."
  run_once: true
