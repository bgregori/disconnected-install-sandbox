---
- name: install python3-pip
  ansible.builtin.dnf:
    name: python3-pip
    state: present

- name: install sushy-tools from bastion pip wheels
  ansible.builtin.pip:
    name: sushy-tools
    extra_args: "--no-index --find-links {{ redfish_bmc_pip_wheel_url }} --trusted-host {{ bastion_private_ip }}"
  register: redfish_bmc_install_result

- name: create sushy config directory
  ansible.builtin.file:
    path: /etc/sushy
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: issue the redfish tls certificate
  ansible.builtin.include_tasks: tls.yml
  when: redfish_bmc_tls | bool

- name: deploy sushy-emulator configuration
  ansible.builtin.template:
    src: sushy-emulator.conf.j2
    dest: "{{ redfish_bmc_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: restart sushy-emulator

- name: deploy sushy-emulator systemd unit
  ansible.builtin.template:
    src: sushy-emulator.service.j2
    dest: /etc/systemd/system/sushy-emulator.service
    owner: root
    group: root
    mode: "0644"
  notify: restart sushy-emulator

- name: reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: enable and start sushy-emulator
  ansible.builtin.systemd:
    name: sushy-emulator
    enabled: true
    state: started

# state: started does not restart an already-running service, and handlers
# otherwise flush at the end of the play -- long after the checks below.
- name: apply pending restarts before verifying
  ansible.builtin.meta: flush_handlers

# Handlers alone are not enough here, which was learned the hard way. If a
# run deploys a new config, notifies a restart, and then fails before
# handlers flush, the next run finds the config already correct, notifies
# nothing, and the stale process keeps serving the old settings forever --
# with the file on disk saying otherwise.
#
# Comparing the service start time against the config and certificate
# mtimes converges regardless of how the previous run ended.
- name: check whether the running service predates its configuration
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      started=$(date -d "$(systemctl show sushy-emulator -p ActiveEnterTimestamp --value)" +%s 2>/dev/null || echo 0)
      newest=$(stat -c %Y {{ redfish_bmc_config_path }})
      {% if redfish_bmc_tls | bool %}
      cert=$(stat -c %Y {{ redfish_bmc_tls_cert }} 2>/dev/null || echo 0)
      [ "$cert" -gt "$newest" ] && newest=$cert
      {% endif %}
      test "${started:-0}" -ge "$newest"
    executable: /bin/bash
  register: redfish_bmc_fresh
  changed_when: false
  failed_when: false

- name: restart sushy when its configuration is newer than the process
  ansible.builtin.systemd:
    name: sushy-emulator
    state: restarted
  when: redfish_bmc_fresh.rc != 0

- name: wait for redfish api to be available
  ansible.builtin.uri:
    url: "{{ redfish_bmc_url }}/redfish/v1/"
    method: GET
    status_code: 200
  register: redfish_bmc_health_check
  retries: 6
  delay: 10
  until: redfish_bmc_health_check.status == 200

- name: verify redfish systems are listed
  ansible.builtin.uri:
    url: "{{ redfish_bmc_url }}/redfish/v1/Systems/"
    method: GET
    return_content: true
    status_code: 200
  register: redfish_bmc_systems_result
