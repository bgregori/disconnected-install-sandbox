---
- name: restart libvirtd
  ansible.builtin.systemd:
    name: libvirtd
    state: restarted

- name: reload networkmanager
  ansible.builtin.systemd:
    name: NetworkManager
    state: reloaded

- name: apply kvm networking
  ansible.builtin.systemd:
    name: kvm-networking
    daemon_reload: true
    state: restarted
