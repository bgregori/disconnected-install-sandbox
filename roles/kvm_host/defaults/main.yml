---
# Fallback only. tasks/main.yml detects the real device at run time, because
# AWS NVMe names depend on attach order and are not stable across reboots.
# Nothing is written to fstab by device path -- see the UUID lookup there.
kvm_host_data_device: /dev/nvme1n1
kvm_host_data_mount: /var/lib/libvirt/images
kvm_host_data_fstype: xfs
kvm_host_data_mount_opts: defaults,nodev,nofail
kvm_host_vms: "{{ ocp_nodes }}"
kvm_host_ocp_node_ips: "{{ ocp_node_ips }}"
kvm_host_reserved_vcpu: "{{ kvm_reserved_vcpu }}"
kvm_host_reserved_memory_mb: "{{ kvm_reserved_memory_mb }}"
kvm_host_network_interface: "{{ ansible_default_ipv4.interface }}"
kvm_host_bridge_name: virbr1
kvm_host_private_ip: "{{ kvm_private_ip }}"
kvm_host_private_cidr: "{{ private_subnet_cidr }}"
kvm_host_cluster_name: "{{ cluster_name }}"
kvm_host_api_vip: "{{ api_vip }}"
kvm_host_ingress_vip: "{{ ingress_vip }}"
