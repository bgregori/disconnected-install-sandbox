---
# Required variables - playbooks fail if these are not provided at runtime.
# Pass via -e on the command line:
#   -e aws_region=us-east-2
#   -e sandbox_domain=example.com
#   -e admin_cidr=$(curl -s ifconfig.me)/32
#
# AWS credentials must be exported as environment variables:
#   export AWS_ACCESS_KEY_ID="AKIA..."
#   export AWS_SECRET_ACCESS_KEY="wJalr..."

# Networking
vpc_cidr: "10.0.0.0/16"
public_subnet_cidr: "10.0.1.0/24"
private_subnet_cidr: "10.0.2.0/24"

# Domain - cluster_domain is derived as {{ cluster_name }}.{{ sandbox_domain }}
cluster_name: ocp

# Tagging
project_tag: disconnected-sandbox

# SSH
ssh_key_name: "{{ project_tag }}-key"
ssh_key_path: "~/.ssh/{{ project_tag }}.pem"

# Keep the local key pair when tearing down, so the next provision reuses it.
#
# infra_ec2 generates the key with community.crypto.openssh_keypair, which is
# already idempotent -- it only writes when the file is missing. So the ONLY
# reason a rebuild produces a new key is that teardown deleted the old one,
# and a new key means every cached copy of the old one is now wrong: the
# ssh-agent entry most of all, which breaks `ssh -A` hops with "Permission
# denied (publickey)" while direct ssh still works, because the ssh config
# reads the new file from disk.
#
# Preserving it makes the fingerprint stable across rebuilds, which is what
# you want when you reprovision the same demo system repeatedly. Host keys
# still rotate -- those legitimately change -- and sandbox_known_hosts keeps
# that churn out of the operator's real known_hosts.
#
# Set false to delete the key on teardown, as earlier versions always did.
sandbox_preserve_ssh_key: true

# Sandbox-scoped known_hosts. The private IPs below are static and recycled
# on every rebuild, so sandbox host keys are kept out of the operator's real
# ~/.ssh/known_hosts. Used by group_vars/private_hosts.yml (the ProxyCommand
# hop) and by the infra_ssh_config role.
#
# ansible.cfg sets the same path literally under [ssh_connection], because
# an ini file cannot template. Change both together.
sandbox_known_hosts: "~/.ssh/known_hosts.{{ project_tag }}"

# Static private IPs
bastion_private_ip: "10.0.1.10"
services_private_ip: "10.0.2.10"
registry_private_ip: "10.0.2.20"

# OpenShift cluster topology
# ---------------------------------------------------------------------------
# Pick a topology and everything else is derived from it: node count, node IPs,
# VIPs, DNS records, per-VM sizing, and the KVM host data volume size.
#
#   sno       1 schedulable master, sized for an OpenShift Virtualization POC
#   compact   3 schedulable masters, no dedicated workers
#   standard  3 masters + 3 workers
#
# Select at runtime with -e ocp_topology=standard
#
# Every derived value stays individually overridable, so you only set what you
# actually want to change:
#   -e ocp_worker_count=5 -e ocp_worker_memory_mb=65536 -e kvm_data_volume_size=2000
#
# All presets fit an m5.metal host (96 vCPU / 384 GiB) with headroom for the
# hypervisor. data_volume_size covers every VM disk plus room for agent ISOs.
ocp_topology: compact

ocp_topology_presets:
  sno:
    masters: 1
    workers: 0
    data_volume_size: 750
    master:
      vcpu: 32
      memory_mb: 131072
      disk_gb: 120
      storage_disk: true
      storage_disk_gb: 500
    worker:
      vcpu: 8
      memory_mb: 32768
      disk_gb: 120
      storage_disk: false
      storage_disk_gb: 0
  compact:
    masters: 3
    workers: 0
    data_volume_size: 1000
    master:
      vcpu: 16
      memory_mb: 49152
      disk_gb: 120
      storage_disk: true
      storage_disk_gb: 150
    worker:
      vcpu: 8
      memory_mb: 32768
      disk_gb: 120
      storage_disk: false
      storage_disk_gb: 0
  standard:
    masters: 3
    workers: 3
    data_volume_size: 900
    master:
      vcpu: 8
      memory_mb: 24576
      disk_gb: 120
      storage_disk: false
      storage_disk_gb: 0
    worker:
      vcpu: 8
      memory_mb: 32768
      disk_gb: 120
      storage_disk: false
      storage_disk_gb: 0

ocp_topology_spec: "{{ ocp_topology_presets[ocp_topology] }}"

ocp_master_count: "{{ ocp_topology_spec.masters }}"
ocp_worker_count: "{{ ocp_topology_spec.workers }}"
ocp_node_count: "{{ (ocp_master_count | int) + (ocp_worker_count | int) }}"
ocp_node_ip_start: 100

ocp_master_vcpu: "{{ ocp_topology_spec.master.vcpu }}"
ocp_master_memory_mb: "{{ ocp_topology_spec.master.memory_mb }}"
ocp_master_disk_gb: "{{ ocp_topology_spec.master.disk_gb }}"
ocp_master_storage_disk: "{{ ocp_topology_spec.master.storage_disk }}"
ocp_master_storage_disk_gb: "{{ ocp_topology_spec.master.storage_disk_gb }}"

ocp_worker_vcpu: "{{ ocp_topology_spec.worker.vcpu }}"
ocp_worker_memory_mb: "{{ ocp_topology_spec.worker.memory_mb }}"
ocp_worker_disk_gb: "{{ ocp_topology_spec.worker.disk_gb }}"
ocp_worker_storage_disk: "{{ ocp_topology_spec.worker.storage_disk }}"
ocp_worker_storage_disk_gb: "{{ ocp_topology_spec.worker.storage_disk_gb }}"

# Node inventory - masters first, then workers, on sequential IPs from
# ocp_node_ip_start. Single source of truth for libvirt domains, DNS records,
# SSH config entries, and the secondary IPs assigned to the KVM host ENI.
ocp_nodes: "{{ (ocp_nodes_yaml | from_yaml) or [] }}"
ocp_nodes_yaml: |
  {% for i in range(ocp_master_count | int) %}
  - name: {{ cluster_name }}-master-{{ i }}
    hostname: master-{{ i }}
    role: master
    ip: 10.0.2.{{ (ocp_node_ip_start | int) + i }}
    vcpu: {{ ocp_master_vcpu | int }}
    memory_mb: {{ ocp_master_memory_mb | int }}
    disk_gb: {{ ocp_master_disk_gb | int }}
    storage_disk: {{ ocp_master_storage_disk | bool | ternary('true', 'false') }}
    storage_disk_gb: {{ ocp_master_storage_disk_gb | int }}
  {% endfor %}
  {% for i in range(ocp_worker_count | int) %}
  - name: {{ cluster_name }}-worker-{{ i }}
    hostname: worker-{{ i }}
    role: worker
    ip: 10.0.2.{{ (ocp_node_ip_start | int) + (ocp_master_count | int) + i }}
    vcpu: {{ ocp_worker_vcpu | int }}
    memory_mb: {{ ocp_worker_memory_mb | int }}
    disk_gb: {{ ocp_worker_disk_gb | int }}
    storage_disk: {{ ocp_worker_storage_disk | bool | ternary('true', 'false') }}
    storage_disk_gb: {{ ocp_worker_storage_disk_gb | int }}
  {% endfor %}

ocp_node_ips: "{{ ocp_nodes | map(attribute='ip') | list }}"

# OpenShift VIPs — keepalived manages these on multi-node clusters.
# For SNO (ocp_node_count=1), VIPs collapse to the single node's IP.
api_vip: >-
  {{ ocp_node_ips[0]
     if (ocp_node_count | int) == 1
     else '10.0.2.' ~ ((ocp_node_ip_start | int) + (ocp_node_count | int)) }}
ingress_vip: >-
  {{ ocp_node_ips[0]
     if (ocp_node_count | int) == 1
     else '10.0.2.' ~ ((ocp_node_ip_start | int) + (ocp_node_count | int) + 1) }}

# Instance types and volumes (in all.yml because Phase 1 runs on localhost
# which does not load per-group group_vars)
bastion_instance_type: t3.xlarge
bastion_root_volume_size: 500
# t3.medium (4 GiB) is enough for BIND and chrony. Keycloak is not: the two
# container memory limits come to 2304 MiB, and a t3.medium reports ~3576 MiB
# usable with ~2876 MiB free once the STIG'd base is running -- about 570 MiB
# of headroom on a host that also serves DNS and NTP. First start is the worst
# moment for that, because KC_DB is a build-time option so every start re-runs
# the Quarkus augmentation, with the realm import on top. An OOM kill there
# shows up as a restart loop (the unit is Restart=always), not a clean error.
#
# t3.large doubles memory to 8 GiB at the same 2 vCPU, and is already the
# registry host's size, so this adds no new instance type to the environment.
#
# Note this sizes the HOST, not the JVM: Keycloak takes 70% of its cgroup
# limit, so raising keycloak_idp_memory is a separate decision. The win here
# is margin for BIND, chrony, page cache and the augmentation spike.
#
# Override directly with -e services_instance_type=... if you want something
# else; this only picks the default.
services_instance_type: "{{ 't3.large' if enable_keycloak_idp | bool else 't3.medium' }}"
services_root_volume_size: 50
registry_instance_type: t3.large
registry_root_volume_size: 200
registry_data_volume_size: 500
registry_port: 8443
# Bastion local yum repo - serves packages to air-gapped private hosts.
#
# Served over TLS with a certificate from the environment CA. The port is
# unchanged and carries HTTPS: the private hosts reach the repo before
# bind_dns exists, so they connect by IP, and keeping one port avoids
# widening the bastion security group for a second listener.
#
# Clients therefore verify the bastion against the root CA, which is why
# the pki play runs first in phase 2. Set bastion_repo_tls=false to fall
# back to plain HTTP if TLS ever strands the air-gapped hosts -- that is
# the escape hatch, and it is the only thing between a broken certificate
# and a phase 2 that cannot install packages.
bastion_repo_port: 8080
bastion_repo_tls: "{{ sandbox_tls_everywhere }}"
bastion_repo_scheme: "{{ 'https' if bastion_repo_tls | bool else 'http' }}"
bastion_repo_url: "{{ bastion_repo_scheme }}://{{ bastion_private_ip }}:{{ bastion_repo_port }}"
# Subdirectory of the bastion document root holding saved container image
# archives. bastion_repo writes it, keycloak_idp fetches from it; defined
# here so neither role has to reach into the other's defaults.
bastion_repo_container_dir_name: container-images

# Keycloak (Red Hat build of Keycloak) OIDC identity provider on the services
# host. Keycloak terminates TLS itself, so this is its own HTTPS listener --
# nothing proxies it. The issuer a cluster federates to is
# https://keycloak.{{ cluster_domain }}:{{ keycloak_port }}/realms/{{ keycloak_realm }}
#
# Off by default -- opt in with -e enable_keycloak_idp=true. Standing the IdP
# up also makes the bastion pull and stage the container images, and that is
# the step needing Red Hat registry credentials, so a sandbox that does not
# want an issuer is not made to supply them.
enable_keycloak_idp: false
keycloak_port: 8443
keycloak_realm: openshift
keycloak_hostname: "keycloak.{{ cluster_domain }}"
keycloak_issuer_url: "https://{{ keycloak_hostname }}:{{ keycloak_port }}/realms/{{ keycloak_realm }}"
# Where the issuer's CA lands on the services host. validate.yml and the
# operator both read it from here, so it lives in all.yml rather than in the
# role, which is the only thing that writes it.
keycloak_ca_cert_path: /etc/pki/keycloak/keycloak-ca.crt

# RHBK 26.6 is the current release stream. The second component of the image
# tag is a BUILD number, not the z-stream: 26.6-20 is what ships RHBK 26.6.7.
# There is no 26.6.7 tag. Pin to a build or a digest for a reproducible
# sandbox; the floating 26.6 tag is the default because this is a sandbox.
keycloak_image: "registry.redhat.io/rhbk/keycloak-rhel9:26.6"
# PostgreSQL 16 sits inside the 14.x-18.x range RHBK 26.6 supports.
keycloak_postgres_image: "registry.redhat.io/rhel9/postgresql-16:1"

# The bastion pulls these and podman-saves them under
# bastion_repo_container_dir_name; keycloak_idp fetches and podman-loads
# them. Named in one place so the two ends cannot drift.
keycloak_image_archives:
  - image: "{{ keycloak_image }}"
    archive: rhbk-keycloak.tar
  - image: "{{ keycloak_postgres_image }}"
    archive: rhbk-postgres.tar

# KVM host for bare metal simulation (Agent-Based Installer)
enable_kvm_host: true
kvm_private_ip: "10.0.2.30"
kvm_instance_type: m5.metal
# Bare metal is slow to start and much slower to terminate.
# amazon.aws.ec2_instance's wait defaults to 600s, which is not enough:
# teardown measured this m5.metal taking over 15 minutes to reach
# terminated, so the module stopped waiting, teardown moved on to the VPC,
# and the subnet delete failed on an ENI still attached to the dying
# instance. The symptom was a teardown that always needed running twice.
# rhel_hardening_reboot_timeout is 1200 for the same underlying reason.
instance_wait_timeout: 1800
# How long phase2_configure.yml waits for a host to answer SSH. Separate
# from instance_wait_timeout because the two measure different things:
# ec2_instance's `wait` returns when EC2 reports the instance running, and
# bare metal reaches that state minutes before sshd is listening. This is
# the metal host's budget; the t3 instances answer in about a minute and
# cost nothing by sharing it.
host_ssh_wait_timeout: 1800
kvm_root_volume_size: 200
# Sized for the selected topology - override with -e kvm_data_volume_size=<gb>
kvm_data_volume_size: "{{ ocp_topology_spec.data_volume_size }}"
# Host resources held back from the VMs (hypervisor, libvirt, agent ISOs)
kvm_reserved_vcpu: 8
kvm_reserved_memory_mb: 16384
redfish_port: 8000
# Built here rather than in the role, for the same reason as
# bastion_repo_url: validate.yml applies no roles, so a role default is
# out of scope there and resolves to undefined. Anything consumed outside
# the owning role has to live at this level.
redfish_scheme: "{{ 'https' if sandbox_tls_everywhere | bool else 'http' }}"
redfish_url: "{{ redfish_scheme }}://{{ kvm_private_ip }}:{{ redfish_port }}"

# Hardening
rhel_hardening_enable_fips: true
rhel_hardening_apply_stig: true
rhel_hardening_stig_profile: xccdf_org.ssgproject.content_profile_stig

# Environment PKI
# ---------------------------------------------------------------------------
# One root CA for every TLS endpoint in the sandbox. Lives on the CONTROLLER,
# not on a sandbox host: hosts generate their own leaf keys and send a CSR to
# be signed, so nothing here needs the CA private key.
#
# artifacts/ is gitignored. Preserved across rebuilds for the same reason the
# SSH key is -- a stable root means anything taught to trust this sandbox
# once keeps working after a reprovision.
#
# The CA directory itself is NOT set here -- it is anchored to the pki
# role's own location so it resolves to <repo>/artifacts/pki however
# ansible was invoked. playbook_dir follows the playbook, and inventory_dir
# is undefined for the implicit localhost you get when the inventory yields
# no hosts. Both were tried; both moved the root of trust around. Override
# pki_ca_dir directly if you need it somewhere else.

# Master switch for the TLS-everywhere posture. Individual services can
# still be overridden one at a time (bastion_repo_tls, redfish_bmc_tls),
# but this turns the lot off in one place if a certificate problem ever
# makes the environment unreachable.
sandbox_tls_everywhere: true

sandbox_ca_cert_path: /etc/pki/ca-trust/source/anchors/sandbox-ca.crt
sandbox_preserve_ca: true

# Derived - used throughout roles and templates
cluster_domain: "{{ cluster_name }}.{{ sandbox_domain }}"

# Connection defaults for private hosts
ansible_user: ec2-user
ansible_ssh_private_key_file: "{{ ssh_key_path }}"
