[defaults]
inventory = inventory/aws_ec2.yml
roles_path = roles
collections_paths = ~/.ansible/collections
host_key_checking = false
retry_files_enabled = false
deprecation_warnings = false
interpreter_python = auto_silent
stdout_callback = ansible.builtin.default
callback_result_format = yaml
forks = 10

[ssh_connection]
# UserKnownHostsFile keeps reprovisioned sandbox host keys out of the operator's
# real known_hosts - the private IPs are static and get recycled every rebuild.
#
# ServerAlive* keeps a silent task from looking like an idle connection. The STIG
# remediation prints nothing for 10+ minutes; without keepalives a NAT or firewall
# on the operator's network drops the connection mid-task, the result never
# arrives, and ansible-playbook waits forever. With them, the path stays warm and
# a connection that does die is detected in 3 minutes (30s x 6).
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o UserKnownHostsFile=~/.ssh/known_hosts.disconnected-sandbox
pipelining = true
# Retry a task whose ssh connection failed (exit 255, "Data could not be sent to
# remote host") instead of marking the host unreachable -- an unreachable host is
# dropped for the rest of the run, and a rerun then starts from a half-configured
# one. Retries back off 1s, 2s, 4s. A task cut off mid-run is sent again -- the
# same thing a rerun of the playbook does, which Phase 2 is written to survive.
retries = 3

[privilege_escalation]
become = true
become_method = sudo
become_user = root
become_ask_pass = false
